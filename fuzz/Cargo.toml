[package]
name = "textweaver-fuzz"
version = "0.0.0"
description = "cargo-fuzz targets for textweaver's loaders and settings files (not part of the workspace build)"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
textweaver-core = { path = "../crates/textweaver-core" }
# `url` for the web target: the response reader only, no requests.
textweaver-formats = { path = "../crates/textweaver-formats", features = ["url"] }
textweaver-text = { path = "../crates/textweaver-text" }
# The picture decoders only; no OCR engine.
textweaver-ocr = { path = "../crates/textweaver-ocr", default-features = false }
textweaver-store = { path = "../crates/textweaver-store" }
textweaver-keymap = { path = "../crates/textweaver-keymap" }
textweaver-enginehost = { path = "../crates/textweaver-enginehost" }
# The engine crates for their protocol messages only: no audio output.
textweaver-eci = { path = "../crates/textweaver-eci", default-features = false }
textweaver-dectalk = { path = "../crates/textweaver-dectalk", default-features = false }
textweaver-sapi = { path = "../crates/textweaver-sapi", default-features = false }
serde_json = "1"
toml = "1.1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
# Cloud Agent task 1: the parsers a student's own writing goes through.
textweaver-math = { path = "../crates/textweaver-math" }
textweaver-cite = { path = "../crates/textweaver-cite" }
textweaver-theme = { path = "../crates/textweaver-theme" }
textweaver-lexicon = { path = "../crates/textweaver-lexicon" }
textweaver-vault = { path = "../crates/textweaver-vault" }
# The JSON-RPC server, without the conversion and citation stack. It links
# the audio output, which needs the ALSA headers (libasound2-dev) on Linux,
# so it is behind the `rpc` feature and the other targets build without it.
textweaver-app = { path = "../crates/textweaver-app", default-features = false, optional = true }

[features]
# The `rpc` target: `cargo +nightly fuzz run rpc --features rpc`.
rpc = ["dep:textweaver-app"]

# Its own workspace, so the root workspace never builds it.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "markdown"
path = "fuzz_targets/markdown.rs"
test = false
doc = false
bench = false

