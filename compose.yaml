# Development container for textweaver. See docs/dev/docker.md.
#
#   docker compose build dev
#   docker compose run --rm dev cargo test --workspace
#   docker compose run --rm dev            # interactive shell in /work
#
# For parallel work in more than one worktree, mount only that worktree and
# set TW_AGENT so it gets its own build volume:
#
#   TW_AGENT=alice docker compose run --rm -v "<worktree>:/work" dev cargo test
#
# Limits (corrected September 27, 2026): Docker's machine has about 31 GB in
# all, so at most three containers build at once. Each gets 6 GB of RAM, 4
# CPUs, and 4 cargo jobs by default; set TW_MEM, TW_CPUS, and TW_JOBS to change
# them. Before a build, at least 26 GB of host RAM must be free. The shared
# compile cache is capped at 30 GB. Build volumes are listed and removed after
# an agent's work is merged (tools/build-hygiene.ps1). See
# the Wave 4 orchestration plan (kept outside the repository) for the budget.
services:
  dev:
    build:
      context: docker
      dockerfile: Dockerfile
    image: textweaver-dev:latest
    working_dir: /work
    volumes:
      - .:/work
      - target:/target
      - sccache:/sccache
      - textweaver-cargo-registry:/usr/local/cargo/registry
      - textweaver-cargo-git:/usr/local/cargo/git
    environment:
      CARGO_TARGET_DIR: /target
      CARGO_BUILD_JOBS: ${TW_JOBS:-4}
      SCCACHE_CACHE_SIZE: 30G
    mem_limit: ${TW_MEM:-6g}
    cpus: ${TW_CPUS:-4}
    stdin_open: true
    tty: true

volumes:
  target:
    name: tw-target-${TW_AGENT:-orch}
  sccache:
    name: textweaver-sccache
  textweaver-cargo-registry:
  textweaver-cargo-git:
