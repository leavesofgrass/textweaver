"linux-aarch64.tar.gz" = 61618186
"linux-x86_64-gui.AppImage" = 40835576
"linux-x86_64-gui.tar.gz" = 42714711
"linux-x86_64.AppImage" = 62687736
"linux-x86_64.tar.gz" = 66325497
"macos-universal-gui.zip" = 65411740
"macos-universal.tar.gz" = 113489596
"windows-x86_64-gui.zip" = 43735774
"windows-x86_64.zip" = 70080418

