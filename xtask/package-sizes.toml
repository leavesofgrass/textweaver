"linux-aarch64-gui.tar.gz" = 39435795
"linux-aarch64.AppImage" = 57477640
"linux-aarch64.tar.gz" = 60806427
"linux-x86_64-gui.AppImage" = 40380920
"linux-x86_64-gui.tar.gz" = 42232216
"linux-x86_64.AppImage" = 61901304
"linux-x86_64.tar.gz" = 65449528
"macos-universal-gui.zip" = 64504663
"macos-universal.tar.gz" = 111911263
"windows-x86_64-gui.zip" = 43175854
"windows-x86_64.zip" = 69108008

