# The wxDragon GUI (textweaver-gui) on Windows and macOS: build, clippy, unit
# tests, a launch smoke test, and on Windows the UI Automation report
# (crates/textweaver-gui/tools/uia-report.ps1), uploaded as an artifact.
# Kept apart from ci.yml because the first wxWidgets build takes minutes.
# ADR-0014.

name: GUI

on:
  push:
    branches: [main, 'wave2/k-*']
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/gui.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/gui.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # wxdragon-sys builds wxWidgets with CMake; keep its trees outside target/
  # so actions/cache can keep them between runs.
  WXWIDGETS_DIR: ${{ github.workspace }}/../wx/src
  WXWIDGETS_BUILD_DIR: ${{ github.workspace }}/../wx/build
  WXDRAGON_SYS_BUILD_DIR: ${{ github.workspace }}/../wx/wrapper

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # The MSVC environment (cl, link, the SDK) for CMake and Ninja, from
      # vcvars64.bat: the variables it changes go to GITHUB_ENV.
      - name: MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'No Visual Studio with the C++ tools found' }
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $name, $value = $Matches[1], $Matches[2]
              if ($name -notmatch '^(GITHUB_|RUNNER_)' -and $before[$name] -ne $value) {
                "$name=$value" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
              }
            }
          }
      - name: Ninja and libclang
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          # bindgen (wxdragon-sys) needs libclang; the image ships LLVM.
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The wxWidgets build depends on the wxdragon-sys version (which pins
      # the wxWidgets release), not on the rest of Cargo.lock.
      - name: wxdragon-sys version
        id: wx
        shell: bash
        run: |
          v=$(grep -A1 '^name = "wxdragon-sys"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Cache wxWidgets build
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/../wx
          key: wx-${{ runner.os }}-wxdragon-sys-${{ steps.wx.outputs.version }}
      - name: Build (timed)
        shell: pwsh
        run: |
          cmake --version | Select-Object -First 1
          ninja --version
          $sw = [Diagnostics.Stopwatch]::StartNew()
          cargo build --locked -p textweaver-gui --timings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "cargo build -p textweaver-gui: $([math]::Round($sw.Elapsed.TotalSeconds, 1)) s" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - name: Clippy
        run: cargo clippy --locked -p textweaver-gui --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked -p textweaver-gui
      - name: UI Automation report (silent paced backend, window never activated)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File crates/textweaver-gui/tools/uia-report.ps1 -NameModes "label,accessible" -Out uia-report.md
          Get-Content uia-report.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gui-windows
          path: |
            uia-report.md
            target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Ninja
        run: brew install ninja || true
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: wxdragon-sys version
        id: wx
        run: |
          v=$(grep -A1 '^name = "wxdragon-sys"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Cache wxWidgets build
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/../wx
          key: wx-${{ runner.os }}-wxdragon-sys-${{ steps.wx.outputs.version }}
      - name: Build (timed)
        run: |
          cmake --version | head -1
          start=$(date +%s)
          cargo build --locked -p textweaver-gui --timings
          echo "cargo build -p textweaver-gui: $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Clippy
        run: cargo clippy --locked -p textweaver-gui --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked -p textweaver-gui
      # --exit-after 8 closes the window after 8 s. If it is still open 15 s
      # later, the GUI logs why and exits with status 3 on its own; the
      # 60 s limit here is the last resort.
      - name: Launch smoke test (silent; closes itself)
        run: |
          ./target/debug/textweaver-gui fixtures/sample.md --backend paced --read --log \
            --home "$RUNNER_TEMP/tw-home" --exit-after 8 2> gui-macos.log &
          pid=$!
          for _ in $(seq 1 60); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then kill "$pid"; echo "did not exit"; cat gui-macos.log; exit 1; fi
          status=0
          wait "$pid" || status=$?
          cat gui-macos.log
          if [ "$status" -ne 0 ]; then echo "textweaver-gui exited with status $status"; exit 1; fi
          grep -q "loaded " gui-macos.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gui-macos
          path: |
            gui-macos.log
            target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
