# The Xilem GUI (textweaver-xilem, ADR-0027) on Windows, macOS, and Linux:
# build, clippy, tests, and the accessibility checks, which never take the
# foreground and play no audio:
# - Windows: the UI Automation report (tools/uia-report.ps1);
# - Linux: the AT-SPI check under Xvfb (tools/atspi-check.sh);
# - macOS: a smoke run that reads with the silent paced backend and exits.
# On all three, the window's accessibility tree is dumped with
# accessibility-cli (pinned by commit) and compared with main's last run;
# the difference is in the run summary, in words (ADR-0039).
# Review screenshots at 100% and 200% are uploaded from Linux.
# Kept apart from ci.yml because Vello and wgpu add minutes to a cold build.

name: GUI (Xilem)

on:
  push:
    branches: [main, 'wave3/b-*']
    paths:
      - 'crates/**'
      - 'third_party/xilem/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'tools/a11y/**'
      - 'fixtures/t/**'
      - '.github/workflows/gui-xilem.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'third_party/xilem/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tools/a11y/**'
      - 'fixtures/t/**'
      - '.github/workflows/gui-xilem.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # To fetch main's last accessibility tree (tools/a11y/fetch-baseline.sh).
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # accessibility-cli (DioxusLabs, MIT or Apache-2.0) is not on crates.io;
  # it is built from this commit with its own Cargo.lock (ADR-0039).
  A11Y_CLI_REV: f64c036915095fbb9187b6fdf0f039879618a159

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-xilem
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked -p textweaver-xilem
      - run: cargo clippy --locked -p textweaver-xilem --all-targets -- -D warnings
      - run: cargo test --locked -p textweaver-xilem
      # The runner has no graphics card, so wgpu renders through WARP
      # (d3d10warp.dll), which crashed on Vello's compute shaders (access
      # violation 0xC0000005, with DXC or FXC alike). The report runs the
      # hybrid renderer (CPU strips, simple shaders), as the Linux AT-SPI
      # check does on Mesa's software GPU.
      - name: Build with the hybrid renderer for the report
        run: cargo build --locked -p textweaver-xilem --no-default-features --features screenshot,renderer-hybrid
      - name: UI Automation report
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File crates/textweaver-xilem/tools/uia-report.ps1 -Out uia-xilem.md
          Get-Content uia-xilem.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: uia-xilem-report
          path: uia-xilem.md
      # The accessibility tree, dumped with accessibility-cli and compared
      # with main's last run (ADR-0039). Report-only for now: a failure here
      # does not fail the job until the dump has been green on main.
      # Restored and saved as separate steps, so the build (about eight
      # minutes) is kept even when a later step fails or the run is
      # cancelled, which skips actions/cache's end-of-job save.
      - name: accessibility-cli (pinned by commit, cached)
        id: a11y-cli
        # The tree is dumped even when a test above failed: it checks
        # something else, and the build it needs is already done.
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@v6
        with:
          path: a11y-cli
          key: a11y-cli-${{ runner.os }}-${{ env.A11Y_CLI_REV }}
      - name: Build accessibility-cli
        if: ${{ !cancelled() && steps.a11y-cli.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          # Its warnings are not ours to deny.
          RUSTFLAGS: ''
        run: |
          cargo install --locked --git https://github.com/DioxusLabs/accessibility-cli \
            --rev "$A11Y_CLI_REV" accessibility-cli --root a11y-cli
      - name: Save accessibility-cli
        if: ${{ !cancelled() && steps.a11y-cli.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: a11y-cli
          key: a11y-cli-${{ runner.os }}-${{ env.A11Y_CLI_REV }}
      - name: Accessibility tree dump
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/a11y/tree-dump.ps1 -Out a11y-tree -Cli a11y-cli/bin/accessibility-cli.exe
      - name: Accessibility tree against main
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/a11y/fetch-baseline.sh gui-xilem.yml a11y-tree-windows a11y-baseline
          python tools/a11y/tree_report.py compare --system Windows \
            --current a11y-tree/tree.txt --baseline a11y-baseline/tree.txt \
            --baseline-run "$(cat a11y-baseline/run-id.txt 2>/dev/null || true)" \
            --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: a11y-tree-windows
          path: |
            a11y-tree/*.json
            a11y-tree/*.txt
            a11y-tree/gui.log
          if-no-files-found: warn
      # The GUI's own package (a zip), on main and by hand: the dist profile
      # is a long build.
      - name: Package (cargo xtask gui-dist)
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: cargo xtask gui-dist --out gui-dist
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          name: textweaver-gui-windows
          path: gui-dist/*.zip

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-xilem
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked -p textweaver-xilem
      - run: cargo clippy --locked -p textweaver-xilem --all-targets -- -D warnings
      - run: cargo test --locked -p textweaver-xilem
      - name: Smoke run (reads with the paced backend, then exits)
        run: |
          home=$(mktemp -d)
          status=0
          ./target/debug/textweaver-xilem fixtures/sample.md --backend paced --read --background \
            --exit-after 6 --home "$home" --log-file gui.log || status=$?
          cat gui.log
          test "$status" -eq 0
          grep -q "Reading at" gui.log
          grep -q "closed" gui.log
      # The accessibility tree, dumped with accessibility-cli and compared
      # with main's last run (ADR-0039). Report-only for now: a failure here
      # does not fail the job until the dump has been green on main.
      # Restored and saved as separate steps, so the build (about eight
      # minutes) is kept even when a later step fails or the run is
      # cancelled, which skips actions/cache's end-of-job save.
      - name: accessibility-cli (pinned by commit, cached)
        id: a11y-cli
        # The tree is dumped even when a test above failed: it checks
        # something else, and the build it needs is already done.
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@v6
        with:
          path: a11y-cli
          key: a11y-cli-${{ runner.os }}-${{ env.A11Y_CLI_REV }}
      - name: Build accessibility-cli
        if: ${{ !cancelled() && steps.a11y-cli.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          # Its warnings are not ours to deny.
          RUSTFLAGS: ''
        run: |
          cargo install --locked --git https://github.com/DioxusLabs/accessibility-cli \
            --rev "$A11Y_CLI_REV" accessibility-cli --root a11y-cli
      - name: Save accessibility-cli
        if: ${{ !cancelled() && steps.a11y-cli.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: a11y-cli
          key: a11y-cli-${{ runner.os }}-${{ env.A11Y_CLI_REV }}
      - name: Accessibility tree dump
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          A11Y_CLI: a11y-cli/bin/accessibility-cli
        run: bash tools/a11y/tree-dump.sh a11y-tree
      - name: Accessibility tree against main
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/a11y/fetch-baseline.sh gui-xilem.yml a11y-tree-macos a11y-baseline
          python3 tools/a11y/tree_report.py compare --system macOS \
            --current a11y-tree/tree.txt --baseline a11y-baseline/tree.txt \
            --baseline-run "$(cat a11y-baseline/run-id.txt 2>/dev/null || true)" \
            --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: a11y-tree-macos
          path: |
            a11y-tree/*.json
            a11y-tree/*.txt
            a11y-tree/gui.log
          if-no-files-found: warn
      # textweaver.app in a zip, on main and by hand.
      - name: Package (cargo xtask gui-dist)
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: cargo xtask gui-dist --out gui-dist
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          name: textweaver-gui-macos
          path: gui-dist/*.zip

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-xilem
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Libraries (X11, the AT-SPI bus, Mesa's software Vulkan, accessibility-cli's)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libasound2-dev libespeak-ng-dev libspeechd-dev libfontconfig1-dev \
            xvfb xauth dbus dbus-x11 at-spi2-core python3-pyatspi python3-gi gir1.2-atspi-2.0 \
            mesa-vulkan-drivers libvulkan1 libgl1-mesa-dri libegl1 \
            libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6 libx11-xcb1 \
            libdbus-1-dev libatspi2.0-dev libx11-xcb-dev
      - run: cargo build --locked -p textweaver-xilem
      - run: cargo clippy --locked -p textweaver-xilem --all-targets -- -D warnings
      - run: cargo test --locked -p textweaver-xilem
      # The AT-SPI dump is what Orca reads: roles, names, the live region,
      # and the text interface, under Xvfb with no screen reader running.
      - name: AT-SPI check (hybrid renderer, which suits Mesa's software GPU)
        run: bash crates/textweaver-xilem/tools/atspi-check.sh | tee atspi-xilem.md
      - name: AT-SPI report in the run summary
        if: always()
        run: |
          if [ -s atspi-xilem.md ]; then
            cat atspi-xilem.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Fail: the AT-SPI check wrote no report." >> "$GITHUB_STEP_SUMMARY"
          fi
      # The accessibility tree, dumped with accessibility-cli and compared
      # with main's last run (ADR-0039). Report-only for now: a failure here
      # does not fail the job until the dump has been green on main.
      # Restored and saved as separate steps, so the build (about eight
      # minutes) is kept even when a later step fails or the run is
      # cancelled, which skips actions/cache's end-of-job save.
      - name: accessibility-cli (pinned by commit, cached)
        id: a11y-cli
        # The tree is dumped even when a test above failed: it checks
        # something else, and the build it needs is already done.
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@v6
        with:
          path: a11y-cli
          key: a11y-cli-${{ runner.os }}-${{ env.A11Y_CLI_REV }}
      - name: Build accessibility-cli
        if: ${{ !cancelled() && steps.a11y-cli.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          # Its warnings are not ours to deny.
          RUSTFLAGS: ''
        run: |
          cargo install --locked --git https://github.com/DioxusLabs/accessibility-cli \
            --rev "$A11Y_CLI_REV" accessibility-cli --root a11y-cli
      - name: Save accessibility-cli
        if: ${{ !cancelled() && steps.a11y-cli.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: a11y-cli
          key: a11y-cli-${{ runner.os }}-${{ env.A11Y_CLI_REV }}
      - name: Accessibility tree dump
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          A11Y_CLI: a11y-cli/bin/accessibility-cli
        run: bash tools/a11y/tree-dump.sh a11y-tree
      - name: Accessibility tree against main
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/a11y/fetch-baseline.sh gui-xilem.yml a11y-tree-linux a11y-baseline
          python3 tools/a11y/tree_report.py compare --system Linux \
            --current a11y-tree/tree.txt --baseline a11y-baseline/tree.txt \
            --baseline-run "$(cat a11y-baseline/run-id.txt 2>/dev/null || true)" \
            --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: a11y-tree-linux
          path: |
            a11y-tree/*.json
            a11y-tree/*.txt
            a11y-tree/gui.log
          if-no-files-found: warn
      - name: Review screenshots (100% and 200%)
        run: ./target/debug/textweaver-xilem --review-screenshots screenshots fixtures/sample.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gui-xilem-linux
          path: |
            atspi-xilem.md
            screenshots/*.png
      # A tarball and the GUI's own AppImage, on main and by hand. The
      # AppImage tools are fetched and checked by the same script the
      # release workflow uses.
      - name: Package (cargo xtask gui-dist)
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          sh docker/appimage/fetch-tools.sh "$RUNNER_TEMP/appimage"
          APPIMAGE_EXTRACT_AND_RUN=1 \
          APPIMAGETOOL="$RUNNER_TEMP/appimage/appimagetool" \
          APPIMAGE_RUNTIME="$RUNNER_TEMP/appimage/runtime-x86_64" \
            cargo xtask gui-dist --out gui-dist
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          name: textweaver-gui-linux
          path: |
            gui-dist/*.tar.gz
            gui-dist/*.AppImage
