# Benchmark gate: `cargo xtask bench --quick` on every pull request and
# every push to main, compared with the committed baseline,
# xtask/bench-baseline.json, by the two-way ratchet in xtask/src/ratchet.rs:
#
# - peak heap and allocation counts fail when they grow more than 25
#   percent over the baseline, and also when they fall more than 25 percent
#   below it, so a gain is written into the baseline and the floor never
#   goes stale;
# - times fail when they grow more than 50 percent, only where the
#   baseline entry was measured on this runner type (its gate_times is
#   true); until then they are reported in the log and the job summary;
# - every pathological input (one per loader) must load and plan within
#   its ceiling.
#
# A failed run never becomes the baseline: only `cargo xtask bench
# --update-baseline --reason TEXT` writes it. To refresh this runner's
# entry, run this workflow by hand on main with "update the baseline"
# ticked and a reason; it uploads the new file as the bench-baseline
# artifact, to commit with a message that says why.

name: Bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_baseline:
        description: Measure and write this runner's baseline entry (main only), uploaded as an artifact
        type: boolean
        default: false
      reason:
        description: Why the baseline moves (required to update it)
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: bench --quick (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Bench (quick) and the two-way gate
        if: github.event.inputs.update_baseline != 'true'
        run: cargo xtask bench --quick --json bench.json --baseline xtask/bench-baseline.json
      - name: Bench (quick) and a new baseline entry for this runner
        if: github.event.inputs.update_baseline == 'true'
        env:
          REASON: ${{ github.event.inputs.reason }}
        run: cargo xtask bench --quick --json bench.json --update-baseline --gate-times --reason "$REASON"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-ubuntu-latest
          path: bench.json
          retention-days: 90
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: github.event.inputs.update_baseline == 'true'
        with:
          name: bench-baseline
          path: xtask/bench-baseline.json
          retention-days: 30
