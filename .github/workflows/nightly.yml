# Nightly checks that take too long, or need a nightly compiler, for every
# push (docs/roadmap.md, "CI and quality gates"):
#
# - fuzz: every cargo-fuzz target for 10 minutes on Linux; crashes are
#   uploaded as artifacts (fuzz/README.md says how to replay one);
# - miri: textweaver-core, textweaver-text, and the engine-host protocol
#   module under Miri;
# - asan: the FFI crates' tests (espeak-ng, ECI, DECtalk) under
#   AddressSanitizer on Linux;
# - release: the workspace tests in release mode under cargo-nextest
#   (.config/nextest.toml: retries, and a flaky test named), and the
#   loaders' property tests with many more cases;
# - msrv: `cargo check` with Rust 1.95, the rust-version in Cargo.toml;
# - docker: the development image built from docker/Dockerfile, and the
#   tests run in it with every feature;
# - soak: `cargo xtask soak`, ten minutes of randomized reading with engine
#   host kills (xtask/src/soak.rs);
# - profile: `perf` profiles of `tw info` and of the narration plan of the
#   10 MB corpus, uploaded as flame graphs and as plain-text lists of the
#   hottest functions (the list is in the job summary too);
# - frames: the GUI frame-time probe (`cargo xtask frames`): 200 moves of
#   the spoken word through the whole widget tree, plain and with every
#   aid, at 100 and 200 percent; allocations and nodes per move are gated
#   against xtask/frames-baseline.json, times are reported;
# - features (weekly, Mondays): `cargo hack --each-feature` on the speech,
#   formats, and writers crates.
#
# Nightly Rust is used only where it must be (fuzz, miri, asan); everything
# else uses the toolchain in rust-toolchain.toml. Run it by hand from the
# Actions tab; tick "weekly" to include the feature matrix.

name: Nightly

on:
  schedule:
    # Every night at 03:17 UTC.
    - cron: '17 3 * * *'
    # Mondays at 04:41 UTC: the weekly feature matrix.
    - cron: '41 4 * * 1'
  workflow_dispatch:
    inputs:
      weekly:
        description: Also run the weekly feature matrix (cargo hack)
        type: boolean
        default: false
      soak_minutes:
        description: Minutes for the soak test
        default: '10'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [markdown, html, epub, docx, pdf, settings, keymap, state, frame, daisy, pptx, sheet, archive, image, web, latex_math, asciimath, bibtex, ris, csl_json, theme, lexicon, vault_import, rpc, rtf, odt, docx_revisions, latex, eml, json, svg, obsidian, pdf_annots, sync_record, sync_group]
    steps:
      - uses: actions/checkout@v7
      - name: Nightly Rust (this job only)
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # The toolchain in rust-toolchain.toml, for `cargo xtask`.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            fuzz
            .
          key: fuzz-${{ matrix.target }}
      # Real files are a better start than nothing (fuzz/README.md); the
      # fixtures for each target are listed in xtask/src/fuzz_seed.rs.
      - name: Seed the corpus
        run: cargo xtask fuzz-seed --target ${{ matrix.target }}
      # The rpc target links the app, whose audio output needs ALSA.
      - name: System libraries (rpc only)
        if: matrix.target == 'rpc'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      # --target: the prebuilt cargo-fuzz that install-action fetches is a
      # musl build, and cargo-fuzz defaults to the triple it was built for;
      # AddressSanitizer cannot link against musl's static libc. Every
      # night from September 27, 2026 failed that way before a fuzz target
      # ran.
      - name: Fuzz for 10 minutes
        env:
          FEATURES: ${{ matrix.target == 'rpc' && '--features rpc' || '' }}
        run: |
          # $FEATURES is empty or one flag and its value: split on purpose.
          # shellcheck disable=SC2086
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} $FEATURES -- -max_total_time=600 -rss_limit_mb=4096 -timeout=30
      - name: Upload the crash
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Nightly Rust with Miri (this job only)
        run: |
          rustup toolchain install nightly --profile minimal --component miri,rust-src
          cargo +nightly miri setup
      # Miri runs every operation through an interpreter: property tests
      # get a few cases, and the tests read their fixtures from disk.
      - name: textweaver-core
        env:
          PROPTEST_CASES: '4'
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri test --locked -p textweaver-core
      - name: textweaver-text
        env:
          PROPTEST_CASES: '4'
          MIRIFLAGS: -Zmiri-disable-isolation
        # The property tests take over an hour here even with four cases;
        # they run natively, with many more cases, in the release job.
        run: cargo +nightly miri test --locked -p textweaver-text --lib -- --skip props
      - name: The engine-host protocol
        env:
          PROPTEST_CASES: '4'
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri test --locked -p textweaver-enginehost --lib protocol

  asan:
    name: AddressSanitizer (FFI crates)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libespeak-ng1 espeak-ng-data libasound2-dev pkg-config
      - name: Nightly Rust (this job only)
        run: rustup toolchain install nightly --profile minimal
      # The explicit --target keeps build scripts and proc macros out of the
      # sanitizer. Leak checking is off: libespeak-ng keeps its voice data
      # for the life of the process.
      - name: espeak-ng, ECI, and DECtalk tests
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=0:detect_stack_use_after_return=1
          TEXTWEAVER_ESPEAK_OUTPUT: virtual
        run: |
          cargo +nightly test --locked --target x86_64-unknown-linux-gnu \
            -p textweaver-speech --features espeak --lib
          cargo +nightly test --locked --target x86_64-unknown-linux-gnu \
            -p textweaver-speech --features espeak --test it -- espeak::
          cargo +nightly test --locked --target x86_64-unknown-linux-gnu \
            -p textweaver-eci -p textweaver-dectalk

  release:
    name: tests in release mode
    runs-on: ubuntu-latest
    # A cold release build of the whole workspace with every feature took
    # more than 90 minutes (September 28, 2026), so the job never finished
    # and its cache was never saved.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libespeak-ng1 espeak-ng-data libasound2-dev pkg-config
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-release
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # cargo-nextest with the nightly profile (.config/nextest.toml): each
      # failing test is retried twice, and one that passes on a retry is
      # named FLAKY and still fails the job. The engine-host suites run two
      # at a time.
      - name: Workspace tests (release, nextest)
        run: cargo nextest run --locked --cargo-profile release --profile nightly --workspace --exclude textweaver-xilem --all-features
      # nextest does not run documentation tests.
      - name: Documentation tests (release)
        run: cargo test --locked --release --workspace --exclude textweaver-xilem --all-features --doc
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nextest-junit
          path: target/nextest/nightly/junit.xml
          if-no-files-found: ignore
      - name: Loader property tests, 2,048 cases each
        env:
          PROPTEST_CASES: '2048'
        run: 'cargo test --locked --release -p textweaver-formats --test it -- positions:: hostile::'

  msrv:
    name: MSRV (Rust 1.95)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - run: rustup toolchain install 1.95 --profile minimal
      # rust-version is 1.95 because harper-core 2.11 (grammar, built in by
      # default) needs it; rten 0.26 (Piper, Whisper, OCR) needs 1.94. The GUI needs 1.96 (its own rust-version) and is left out.
      - run: cargo +1.95 check --locked --workspace --exclude textweaver-xilem

  docker:
    name: Docker image and tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Build the development image
        run: docker build -t textweaver-dev docker
      - name: Tests in the image (every feature, no GUI)
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e CARGO_TARGET_DIR=/work/target/docker \
            textweaver-dev cargo test --locked --workspace --exclude textweaver-xilem --all-features --no-fail-fast

  soak:
    name: soak test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: soak
      - name: Soak
        env:
          MINUTES: ${{ github.event.inputs.soak_minutes || '10' }}
        run: cargo xtask soak --minutes "$MINUTES"

  profile:
    name: profile (tw info and the 10 MB plan)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Function names and lines in the profile: the release profile
      # strips symbols, so this run keeps them (Cargo.toml is unchanged).
      CARGO_PROFILE_RELEASE_STRIP: 'false'
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - name: System libraries and perf
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config \
            linux-tools-common linux-tools-generic "linux-tools-$(uname -r)"
          sudo sysctl -w kernel.perf_event_paranoid=1
          sudo sysctl -w kernel.kptr_restrict=0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: profile
      # flamegraph turns perf's samples into an SVG; pinned.
      - name: flamegraph 0.6.14
        run: cargo install flamegraph --locked --version 0.6.14
      - name: Build tw and the bench (release, with symbols)
        run: |
          cargo build --locked --release -p textweaver-cli --bin tw
          cargo build --locked --release -p xtask --features bench
      # The plan run writes the corpora, the 10 MB one among them.
      - name: Profile the 10 MB narration plan
        run: |
          mkdir -p profile
          perf record -F 999 -g -o profile/plan.data -- \
            target/release/xtask bench-run --profile-plan --only md-10mb
          perf report -i profile/plan.data --stdio --no-children --sort symbol \
            -g none --percent-limit 0.5 > profile/plan-top.txt
          flamegraph --perfdata profile/plan.data -o profile/plan.svg
      - name: Profile tw info on the 10 MB corpus
        run: |
          perf record -F 999 -g -o profile/tw-info.data -- \
            target/release/tw info target/bench-corpus/md-10mb.md
          perf report -i profile/tw-info.data --stdio --no-children --sort symbol \
            -g none --percent-limit 0.5 > profile/tw-info-top.txt
          flamegraph --perfdata profile/tw-info.data -o profile/tw-info.svg
      # The flame graphs are pictures; the same profile as a list, in
      # words, in the job summary and the artifact.
      - name: The hottest functions, in words
        run: |
          for name in plan tw-info; do
            {
              echo "## Hottest functions: $name"
              echo
              grep -E '^ +[0-9.]+%' "profile/$name-top.txt" | head -25 | sed 's/^ */- /'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: profile
          path: |
            profile/*.svg
            profile/*-top.txt
          retention-days: 30

  frames:
    name: GUI frame times (report)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq --no-install-recommends \
            libasound2-dev libespeak-ng-dev libspeechd-dev libfontconfig1-dev \
            libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6 libx11-xcb1 \
            libdbus-1-dev libatspi2.0-dev libx11-xcb-dev pkg-config
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: frames
      # No window opens: the probe runs the widget passes headless.
      # Eight runs of 200 moves; the counts are gated once the baseline
      # file has a Linux entry, the times are reported.
      - name: Frame times, plain and with every aid, at 100 and 200 percent
        run: |
          set -o pipefail
          cargo xtask frames --json frames.json --baseline xtask/frames-baseline.json | tee frames.txt
          {
            echo "## GUI frame times"
            echo
            sed 's/^/- /' frames.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: frames
          path: frames.json
          retention-days: 90

  features:
    name: each feature (weekly)
    if: github.event.schedule == '41 4 * * 1' || github.event.inputs.weekly == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libespeak-ng1 espeak-ng-data libasound2-dev pkg-config
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - uses: Swatinem/rust-cache@v2
        with:
          key: features
      - name: Clippy, each feature on its own
        run: |
          cargo hack clippy --locked --each-feature --all-targets \
            -p textweaver-speech -p textweaver-formats -p textweaver-writers -- -D warnings
      - name: Tests, each feature on its own
        env:
          TEXTWEAVER_ESPEAK_OUTPUT: virtual
        run: |
          cargo hack test --locked --each-feature \
            -p textweaver-speech -p textweaver-formats -p textweaver-writers
