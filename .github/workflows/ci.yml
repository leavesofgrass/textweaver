name: CI

on:
  push:
    branches: [main, 'agent/**', 'wave*/**', 'phase*/**', 'integration/**']
  pull_request:

# One run per branch or pull request: a newer push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  docs:
    name: docs (links and site data)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: rustup toolchain install
      # Every relative link and anchor in the Markdown docs and docs/site
      # resolves (tools/check_links.py; standard library only, no network).
      - name: Links and anchors
        run: python tools/check_links.py
      # The data embedded in docs/site/*.html matches cargo metadata,
      # docs/keyboard.md, and the theme files.
      - name: Site data is current
        run: python tools/gen_site_data.py --check
      # Static accessibility checks of the docs/site pages: landmarks,
      # headings, labels, text alternatives, and references.
      - name: Site accessibility checks
        run: python tools/check_site_a11y.py

  # Generated files and repository rules that need no build of the
  # workspace's dependencies: the keyboard reference, the dependency
  # direction between crates (ADR-0001), and the third-party notices.
  generated:
    name: generated files and dependency direction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: docs/keyboard.md is current
        run: cargo xtask keyboard --check
      - name: Dependency direction
        run: cargo xtask deps --check
      - name: THIRD-PARTY-NOTICES.md is current
        run: cargo xtask notices --check

  # Licences, advisories, duplicate versions, and sources (deny.toml).
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux enables every feature, including those that link system
          # libraries (espeak-ng); the same set the Docker image supports.
          - os: ubuntu-latest
            features: --all-features
          # Omnivox is a pure-Rust subprocess backend: build and test it
          # everywhere (docs/tasks.md uses it for native Windows checks).
          - os: macos-latest
            features: --features textweaver-speech/omnivox
          - os: windows-latest
            features: --features textweaver-speech/omnivox
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # espeak-ng is linked through hand-written declarations and
      # speech-dispatcher through its socket, so no clang or bindgen is
      # needed here (the GUI's wxdragon-sys still needs libclang; gui.yml).
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libespeak-ng-dev espeak-ng-data libasound2-dev libspeechd-dev pkg-config
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --locked --workspace --exclude textweaver-gui --all-targets ${{ matrix.features }}
      - name: Test
        run: cargo test --locked --workspace --exclude textweaver-gui ${{ matrix.features }}
      - name: Apple voice tests (macOS; synthesis only, no playback)
        if: runner.os == 'macOS'
        env:
          TEXTWEAVER_APPLE: '1'
        run: cargo test --locked -p textweaver-apple -- --ignored
      - name: 32-bit engine hosts (Windows)
        if: runner.os == 'Windows'
        run: |
          rustup target add i686-pc-windows-msvc
          cargo build --locked -p textweaver-eci -p textweaver-sapi --bins --target i686-pc-windows-msvc
      - name: Docs
        run: cargo doc --locked --workspace --exclude textweaver-gui --no-deps ${{ matrix.features }}
