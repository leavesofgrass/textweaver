name: CI

on:
  push:
    branches: [main, 'agent/**', 'wave*/**', 'phase*/**', 'integration/**']
  pull_request:

# One run per branch or pull request: a newer push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  docs:
    name: docs (links and site data)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: rustup toolchain install
      # Every relative link and anchor in the Markdown docs and docs/site
      # resolves (tools/check_links.py; standard library only, no network).
      - name: Links and anchors
        run: python tools/check_links.py
      # The data embedded in docs/site/*.html matches cargo metadata,
      # docs/keyboard.md, and the theme files.
      - name: Site data is current
        run: python tools/gen_site_data.py --check
      # Static accessibility checks of the docs/site pages: landmarks,
      # headings, labels, text alternatives, and references.
      - name: Site accessibility checks
        run: python tools/check_site_a11y.py

  # Generated files and repository rules that need no build of the
  # workspace's dependencies: the keyboard reference, the dependency
  # direction between crates (ADR-0001), and the third-party notices.
  generated:
    name: generated files and dependency direction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: docs/keyboard.md is current
        run: cargo xtask keyboard --check
      - name: Dependency direction
        run: cargo xtask deps --check
      # cargo-about reads each crate's licence files from the registry
      # sources, so every platform's crates are fetched first.
      - name: THIRD-PARTY-NOTICES.md is current
        run: |
          cargo fetch --locked
          cargo xtask notices --check

  # Licences, advisories, duplicate versions, and sources (deny.toml).
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux enables every feature, including those that link system
          # libraries (espeak-ng); the same set the Docker image supports.
          - os: ubuntu-latest
            features: --all-features
          # Omnivox is a pure-Rust subprocess backend: build and test it
          # everywhere (docs/tasks.md uses it for native Windows checks).
          - os: macos-latest
            features: --features textweaver-speech/omnivox
          - os: windows-latest
            features: --features textweaver-speech/omnivox
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # espeak-ng is linked through hand-written declarations and
      # speech-dispatcher through its socket, so no clang or bindgen is
      # needed here (the GUI's wxdragon-sys still needs libclang; gui.yml).
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libespeak-ng-dev espeak-ng-data libasound2-dev libspeechd-dev pkg-config
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --locked --workspace --exclude textweaver-gui --all-targets ${{ matrix.features }}
      - name: Test
        run: cargo test --locked --workspace --exclude textweaver-gui ${{ matrix.features }}
      - name: Apple voice tests (macOS; synthesis only, no playback)
        if: runner.os == 'macOS'
        env:
          TEXTWEAVER_APPLE: '1'
        run: cargo test --locked -p textweaver-apple -- --ignored
      - name: 32-bit engine hosts (Windows)
        if: runner.os == 'Windows'
        run: |
          rustup target add i686-pc-windows-msvc
          cargo build --locked -p textweaver-eci -p textweaver-sapi -p textweaver-dectalk --bins --target i686-pc-windows-msvc
      # The fake-engine tests against the 32-bit hosts: the 64-bit ECI
      # backend drives the 32-bit ECI host (as it does for Code Factory's
      # eci.dll), and the SAPI and DECtalk tests run as 32-bit programs
      # with their 32-bit hosts.
      - name: Fake-host tests, 32-bit hosts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # An absolute Windows path: the tests run in the crate's folder.
          TEXTWEAVER_ECI_TEST_HOST="$(pwd -W)/target/i686-pc-windows-msvc/debug/textweaver-eci-host.exe" \
            cargo test --locked -p textweaver-eci --test fake_host
          cargo test --locked --target i686-pc-windows-msvc -p textweaver-sapi -p textweaver-dectalk --test fake_host
      - name: Docs
        run: cargo doc --locked --workspace --exclude textweaver-gui --no-deps ${{ matrix.features }}

  # Real engines, where a hosted runner has one. Nothing is ever heard:
  # audio goes to WAV files in temporary folders or to a silent output that
  # consumes samples on a timer.
  real-espeak:
    name: 'Real engine: espeak-ng (Linux, no audio)'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Only the library and its data: textweaver loads libespeak-ng at run
      # time, so no headers are needed.
      - name: espeak-ng
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libespeak-ng1 espeak-ng-data libasound2-dev pkg-config
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: real-espeak
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The espeak backend against libespeak-ng (virtual output)
        env:
          TEXTWEAVER_ESPEAK_OUTPUT: virtual
        run: cargo test --locked -p textweaver-speech --features espeak --test espeak
      - name: tw finds espeak-ng and writes a WAV file
        run: |
          cargo build --locked -p textweaver-cli --bin tw --features espeak
          target/debug/tw backends | tee backends.txt
          grep -q '^espeak: .*\. Available\.' backends.txt
          target/debug/tw speak --backend espeak --out "$RUNNER_TEMP/espeak.wav" "Real engine check."
          test -s "$RUNNER_TEMP/espeak.wav"

  real-sapi:
    name: 'Real engine: SAPI5 Microsoft voices (Windows, no audio)'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: real-sapi
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The runner image's voices decide which tests can run: without
      # Microsoft David the job says so and stops, rather than fail.
      - name: Installed SAPI5 voices
        id: voices
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $names = (New-Object System.Speech.Synthesis.SpeechSynthesizer).GetInstalledVoices() | ForEach-Object { $_.VoiceInfo.Name }
          $names | ForEach-Object { "Voice: $_" }
          $david = [bool]($names | Where-Object { $_ -like 'Microsoft David*' })
          "david=$($david.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $david) { "::notice::Microsoft David is not installed on this runner image; the real SAPI tests were not run." }
      - name: Microsoft voices in the 64-bit host
        if: steps.voices.outputs.david == 'true'
        env:
          TEXTWEAVER_SAPI: '1'
        run: cargo test --locked -p textweaver-sapi --test real_voices -- --ignored --nocapture david every_allowed_voice speaking_and_stopping
