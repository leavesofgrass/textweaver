name: CI

on:
  push:
    branches: [main, 'agent/**', 'wave*/**', 'integration/**']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  docs:
    name: docs (links and site data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install
      # Every relative link and anchor in the Markdown docs and docs/site
      # resolves (tools/check_links.py; standard library only, no network).
      - name: Links and anchors
        run: python tools/check_links.py
      # The data embedded in docs/site/*.html matches cargo metadata,
      # docs/keyboard.md, and the theme files.
      - name: Site data is current
        run: python tools/gen_site_data.py --check
      # Static accessibility checks of the docs/site pages: landmarks,
      # headings, labels, text alternatives, and references.
      - name: Site accessibility checks
        run: python tools/check_site_a11y.py

  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux enables every feature, including those that link system
          # libraries (espeak-ng); the same set the Docker image supports.
          - os: ubuntu-latest
            features: --all-features
          # Omnivox is a pure-Rust subprocess backend: build and test it
          # everywhere (docs/tasks.md uses it for native Windows checks).
          - os: macos-latest
            features: --features textweaver-speech/omnivox
          - os: windows-latest
            features: --features textweaver-speech/omnivox
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libespeak-ng-dev espeak-ng-data libasound2-dev libspeechd-dev clang libclang-dev pkg-config
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --exclude textweaver-gui --all-targets ${{ matrix.features }}
      - name: Test
        run: cargo test --workspace --exclude textweaver-gui ${{ matrix.features }}
      - name: Apple voice tests (macOS; synthesis only, no playback)
        if: runner.os == 'macOS'
        env:
          TEXTWEAVER_APPLE: '1'
        run: cargo test -p textweaver-apple -- --ignored
      - name: 32-bit engine hosts (Windows)
        if: runner.os == 'Windows'
        run: |
          rustup target add i686-pc-windows-msvc
          cargo build -p textweaver-eci -p textweaver-sapi --bins --target i686-pc-windows-msvc
      - name: Docs
        run: cargo doc --workspace --exclude textweaver-gui --no-deps ${{ matrix.features }}
