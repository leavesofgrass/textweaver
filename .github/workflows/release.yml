# Release: on a version tag, create the GitHub release (a pre-release before
# 1.0, notes from CHANGELOG.md), build the Windows and macOS packages with
# `cargo xtask dist`, attest their build provenance, upload them, and write
# SHA256SUMS.txt once at the end. docs/dev/releasing.md has the steps, and the
# local fallback (tools/release-upload.sh) for a package built by hand.
#
# - Windows: x86_64 zip with the x64 and x86 engine hosts; the C runtime is
#   linked statically.
# - macOS: universal binaries (Apple silicon and Intel), signed ad hoc, not
#   notarized.
# - Linux: an AppImage (with a .zsync file for delta updates) and a plain
#   tarball for systems without FUSE, for x86_64 and for aarch64 (on the
#   ubuntu-22.04-arm runner), built on Ubuntu 22.04's glibc and checked on
#   Debian and Fedora (and Arch on x86_64) before upload.
#
# Dry run: start the workflow by hand with the tag left empty. It builds and
# checks every package from the chosen branch and keeps them as workflow
# artifacts, and creates no release, attestation, or tag.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and upload (for example v0.1.0-alpha.3). Leave empty for a dry run: packages as artifacts, no release.'
        required: false
        default: ''

# Never two runs for one tag at once; never cancel a release half way.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  # Build provenance attestations (actions/attest-build-provenance).
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}
  # 'true' for a hand-started run with no tag: build and check only.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag == '' }}

jobs:
  release:
    name: Create the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DRY_RUN != 'true' && env.TAG || '' }}
      - run: rustup toolchain install
      - name: Dry run (no release is created)
        if: env.DRY_RUN == 'true'
        run: echo "Dry run on ${{ github.ref_name }}. The packages are built and checked, then kept as workflow artifacts. No release, tag, or attestation." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Version matches the tag
        if: env.DRY_RUN != 'true'
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="textweaver-tui"))')
          test "v$version" = "$TAG" || { echo "Cargo.toml version $version does not match tag $TAG"; exit 1; }
      - name: Create the release (notes from CHANGELOG.md)
        if: env.DRY_RUN != 'true'
        run: tools/release-upload.sh --no-sums "$TAG"

  windows:
    name: Windows package
    needs: release
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DRY_RUN != 'true' && env.TAG || '' }}
      - run: rustup toolchain install
      - run: rustup target add i686-pc-windows-msvc
      - name: Build the package
        run: cargo xtask dist
      - name: Check the package
        shell: pwsh
        run: |
          $zip = Get-ChildItem target/dist/textweaver-*-windows-x86_64.zip | Select-Object -First 1
          if (-not $zip) { throw 'no package' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $names = [IO.Compression.ZipFile]::OpenRead($zip.FullName).Entries.FullName
          foreach ($want in 'tw.exe', 'textweaver.exe', 'THIRD-PARTY-NOTICES.md', 'licenses/scowl/Copyright', 'licenses/fonts/opendyslexic/OFL.txt') {
            if (-not ($names | Where-Object { $_ -like "*/$want" })) { throw "the package lacks $want" }
          }
          $dir = Get-ChildItem -Directory target/dist/textweaver-*-windows-x86_64 | Select-Object -First 1
          & "$($dir.FullName)/tw.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'tw --version failed' }
          "Windows package: $($zip.Name), $([math]::Round($zip.Length / 1MB, 1)) MB" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - uses: actions/attest-build-provenance@v4
        if: env.DRY_RUN != 'true'
        with:
          subject-path: target/dist/textweaver-*-windows-x86_64.zip
      - name: Upload to the release
        if: env.DRY_RUN != 'true'
        shell: bash
        run: tools/release-upload.sh --no-sums "$TAG" target/dist/textweaver-*-windows-x86_64.zip
      - name: Keep the package (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-windows
          path: target/dist/textweaver-*-windows-x86_64.zip

  macos:
    name: macOS package
    needs: release
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DRY_RUN != 'true' && env.TAG || '' }}
      - run: rustup toolchain install
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build the package
        run: cargo xtask dist --universal
      - name: Check the package
        run: |
          dir=$(ls -d target/dist/textweaver-*-macos-universal)
          lipo -info "$dir/tw" "$dir/textweaver"
          codesign --verify --verbose "$dir/tw" "$dir/textweaver"
          "$dir/tw" --version
          listing=$(tar -tzf target/dist/textweaver-*-macos-universal.tar.gz)
          for want in THIRD-PARTY-NOTICES.md licenses/scowl/Copyright licenses/fonts/opendyslexic/OFL.txt; do
            grep -q "/$want\$" <<< "$listing" || { echo "the package lacks $want"; exit 1; }
          done
      - uses: actions/attest-build-provenance@v4
        if: env.DRY_RUN != 'true'
        with:
          subject-path: target/dist/textweaver-*-macos-universal.tar.gz
      - name: Upload to the release
        if: env.DRY_RUN != 'true'
        run: tools/release-upload.sh --no-sums "$TAG" target/dist/textweaver-*-macos-universal.tar.gz
      - name: Keep the package (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-macos
          path: target/dist/textweaver-*-macos-universal.tar.gz

  linux:
    name: Linux AppImage and tarball, ${{ matrix.arch }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            distros: debian:stable fedora:latest archlinux:latest
          # GitHub's arm64 runner (free for public repositories). Arch
          # Linux publishes no official arm64 image, so aarch64 is checked
          # on Debian and Fedora.
          - arch: aarch64
            runner: ubuntu-22.04-arm
            distros: debian:stable fedora:latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DRY_RUN != 'true' && env.TAG || '' }}
      - name: Runner architecture
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}" || { echo "Fail: the runner is $(uname -m), not ${{ matrix.arch }}"; exit 1; }
      # Built in docker/appimage (Ubuntu 22.04, glibc 2.35), so the
      # packages run on older distributions too; the image downloads
      # appimagetool and the AppImage runtime for this architecture from
      # their GitHub releases and checks their SHA-256
      # (docker/appimage/fetch-tools.sh).
      - name: Build the AppImage and the tarball
        run: |
          docker build -t textweaver-appimage docker/appimage
          docker run --rm -v "$PWD:/work" -w /work --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e CARGO_TARGET_DIR=/work/target/linux \
            textweaver-appimage cargo xtask appimage --out /work/target/dist
      # tw --version, tw backends (espeak unavailable without libespeak-ng,
      # available with it), tw text, --install and --uninstall, the
      # tarball, and install-linux.sh --release with each package.
      - name: Check the packages on ${{ matrix.distros }}
        env:
          DISTROS: ${{ matrix.distros }}
          ARCH: ${{ matrix.arch }}
        run: |
          # One image per word.
          # shellcheck disable=SC2086
          bash docker/appimage/test-distros.sh target/dist $DISTROS
      - name: Package summary
        run: |
          for f in target/dist/textweaver-*-linux-${{ matrix.arch }}.*; do
            echo "Linux package: $(basename "$f"), $(du -m "$f" | cut -f1) MB" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/attest-build-provenance@v4
        if: env.DRY_RUN != 'true'
        with:
          subject-path: |
            target/dist/textweaver-*-linux-${{ matrix.arch }}.AppImage
            target/dist/textweaver-*-linux-${{ matrix.arch }}.tar.gz
      - name: Upload to the release
        if: env.DRY_RUN != 'true'
        run: |
          tools/release-upload.sh --no-sums "$TAG" \
            target/dist/textweaver-*-linux-${{ matrix.arch }}.AppImage \
            target/dist/textweaver-*-linux-${{ matrix.arch }}.AppImage.zsync \
            target/dist/textweaver-*-linux-${{ matrix.arch }}.tar.gz
      - name: Keep the packages (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-linux-${{ matrix.arch }}
          path: |
            target/dist/textweaver-*-linux-${{ matrix.arch }}.AppImage
            target/dist/textweaver-*-linux-${{ matrix.arch }}.tar.gz

  checksums:
    name: SHA256SUMS.txt
    needs: [windows, macos, linux]
    # Not in a dry run: there is no release to sum.
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DRY_RUN != 'true' && env.TAG || '' }}
      # With no files, the script only rebuilds the checksums of every
      # package on the release, once, after all the packages are there.
      - name: Write the checksums
        run: tools/release-upload.sh "$TAG"
      - name: Fetch the checksums file
        run: gh release download "$TAG" --pattern SHA256SUMS.txt --dir sums
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: sums/SHA256SUMS.txt
