# Release: on a version tag, create the GitHub release (a pre-release before
# 1.0, notes from CHANGELOG.md), build the Windows and macOS packages with
# `cargo xtask dist`, attest their build provenance, upload them, and write
# SHA256SUMS.txt once at the end. docs/dev/releasing.md has the steps, and the
# local fallback (tools/release-upload.sh) for a package built by hand.
#
# - Windows: x86_64 zip with the x64 and x86 engine hosts; the C runtime is
#   linked statically.
# - macOS: universal binaries (Apple silicon and Intel), signed ad hoc, not
#   notarized.
# - Linux: an AppImage (with a .zsync file for delta updates) and a plain
#   tarball for systems without FUSE, for x86_64 and for aarch64 (on the
#   ubuntu-22.04-arm runner), built on Ubuntu 22.04's glibc and checked on
#   Debian and Fedora (and Arch on x86_64) before upload.
# - The GUI (textweaver-gui, ADR-0027), from `cargo xtask gui-dist` in each
#   package job: a Windows zip, a macOS .app zip (universal: Apple silicon
#   and Intel), and a Linux AppImage and tarball for x86_64 and aarch64.
#   Each holds the same engine hosts and dictionaries as the terminal
#   package, is built with the same speech engines where the GUI crate
#   has them (espeak-ng and speech-dispatcher on Linux), and is checked
#   (--version, a screenshot drawn on the CPU, and on macOS a silent
#   reading) before upload. Their names end in -gui, so no pattern for the
#   terminal packages matches them, including the update information of
#   AppImages already released.
#
# The terminal packages are smoke-tested beyond --version before upload
# (tools/package-smoke.sh: open a fixture, tw info, tw components list,
# convert one file), and the Linux tarball and AppImage again in a clean
# container with no network (tools/clean-install-smoke.sh). Each job
# checks that its build folder holds exactly its expected files, and the
# checksums job that the published release holds exactly the expected
# assets (cargo xtask release-assets).
#
# Dry run: start the workflow by hand with the tag left empty. It builds and
# checks every package from the chosen branch and keeps them as workflow
# artifacts, and creates no release, attestation, or tag.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and upload (for example v0.1.0-alpha.9). Leave empty for a dry run: packages as artifacts, no release.'
        required: false
        default: ''

# Never two runs for one tag at once; never cancel a release half way.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  # Build provenance attestations (actions/attest-build-provenance).
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}
  # 'true' for a hand-started run with no tag: build and check only.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag == '' }}

jobs:
  release:
    name: Create the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DRY_RUN != 'true' && env.TAG || '' }}
      - run: rustup toolchain install
      - name: Dry run (no release is created)
        if: env.DRY_RUN == 'true'
        run: echo "Dry run on ${{ github.ref_name }}. The packages are built and checked, then kept as workflow artifacts. No release, tag, or attestation." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Version matches the tag
        if: env.DRY_RUN != 'true'
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="textweaver-tui"))')
          test "v$version" = "$TAG" || { echo "Cargo.toml version $version does not match tag $TAG"; exit 1; }
      - name: Create the release (notes from CHANGELOG.md)
        if: env.DRY_RUN != 'true'
        run: tools/release-upload.sh --no-sums "$TAG"

  windows:
    name: Windows package
    needs: release
    runs-on: windows-latest
    # The terminal package, then the GUI's (Vello and wgpu, fat LTO).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DRY_RUN != 'true' && env.TAG || '' }}
      - run: rustup toolchain install
      - run: rustup target add i686-pc-windows-msvc
      - name: Build the package
        run: cargo xtask dist
      - name: Check the package
        shell: pwsh
        run: |
          $zip = Get-ChildItem target/dist/textweaver-*-windows-x86_64.zip | Select-Object -First 1
          if (-not $zip) { throw 'no package' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $names = [IO.Compression.ZipFile]::OpenRead($zip.FullName).Entries.FullName
          foreach ($want in 'tw.exe', 'textweaver.exe', 'THIRD-PARTY-NOTICES.md', 'licenses/scowl/Copyright', 'licenses/fonts/opendyslexic/OFL.txt') {
            if (-not ($names | Where-Object { $_ -like "*/$want" })) { throw "the package lacks $want" }
          }
          "Windows package: $($zip.Name), $([math]::Round($zip.Length / 1MB, 1)) MB" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      # More than --version: open a fixture, tw info, tw components list,
      # and convert one file, on an empty TEXTWEAVER_HOME.
      - name: Smoke-test the package's tw
        shell: bash
        run: |
          for dir in target/dist/textweaver-*-windows-x86_64; do
            [ -d "$dir" ] && break
          done
          bash tools/package-smoke.sh "$dir/tw.exe" fixtures/sample.md | tee -a "$GITHUB_STEP_SUMMARY"
      # The GUI's zip, built in the same folder as the terminal package, so
      # the shared dependencies compile once.
      - name: Build the GUI package
        run: cargo xtask gui-dist
      # textweaver-gui is a GUI-subsystem program: Start-Process waits for
      # it and reads its exit code. No window opens: --version exits, and
      # --screenshot draws on the CPU (the runner's WARP device crashes on
      # Vello's GPU shaders; see gui-xilem.yml).
      - name: Check the GUI package
        shell: pwsh
        run: |
          $zip = Get-ChildItem target/dist/textweaver-*-windows-x86_64-gui.zip | Select-Object -First 1
          if (-not $zip) { throw 'no GUI package' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $names = [IO.Compression.ZipFile]::OpenRead($zip.FullName).Entries.FullName
          foreach ($want in 'textweaver-gui.exe', 'textweaver-eci-host.exe', 'textweaver-sapi-host.exe', 'textweaver-dectalk-host-x86.exe', 'GUI.md', 'lexicon/lexicon-en.twlex', 'THIRD-PARTY-NOTICES.md', 'licenses/scowl/Copyright', 'licenses/xilem/LICENSE') {
            if (-not ($names | Where-Object { $_ -like "*/$want" })) { throw "the GUI package lacks $want" }
          }
          $dir = Get-ChildItem -Directory target/dist/textweaver-*-windows-x86_64-gui | Select-Object -First 1
          $gui = Join-Path $dir.FullName 'textweaver-gui.exe'
          $p = Start-Process -FilePath $gui -ArgumentList '--version' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "textweaver-gui --version failed ($($p.ExitCode))" }
          $png = Join-Path $env:RUNNER_TEMP 'gui-check.png'
          $p = Start-Process -FilePath $gui -ArgumentList '--screenshot', $png, 'fixtures/sample.md' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0 -or -not (Test-Path $png)) { throw "textweaver-gui --screenshot failed ($($p.ExitCode))" }
          "GUI package: $($zip.Name), $([math]::Round($zip.Length / 1MB, 1)) MB" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      # Exactly the files this job uploads: none missing, no stray one.
      - name: The package files are exactly the expected ones
        run: cargo xtask release-assets --dir target/dist --platform windows
      - uses: actions/attest-build-provenance@v4
        if: env.DRY_RUN != 'true'
        with:
          subject-path: |
            target/dist/textweaver-*-windows-x86_64.zip
            target/dist/textweaver-*-windows-x86_64-gui.zip
      - name: Upload to the release
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          tools/release-upload.sh --no-sums "$TAG" \
            target/dist/textweaver-*-windows-x86_64.zip \
            target/dist/textweaver-*-windows-x86_64-gui.zip
      - name: Keep the packages (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-windows
          path: |
            target/dist/textweaver-*-windows-x86_64.zip
            target/dist/textweaver-*-windows-x86_64-gui.zip

  macos:
    name: macOS package
    needs: release
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DRY_RUN != 'true' && env.TAG || '' }}
      - run: rustup toolchain install
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build the package
        run: cargo xtask dist --universal
      - name: Check the package
        run: |
          dir=$(ls -d target/dist/textweaver-*-macos-universal)
          lipo -info "$dir/tw" "$dir/textweaver"
          codesign --verify --verbose "$dir/tw" "$dir/textweaver"
          # More than --version: open a fixture, tw info, tw components
          # list, and convert one file, on an empty TEXTWEAVER_HOME.
          set -o pipefail
          bash tools/package-smoke.sh "$dir/tw" fixtures/sample.md | tee -a "$GITHUB_STEP_SUMMARY"
          listing=$(tar -tzf target/dist/textweaver-*-macos-universal.tar.gz)
          for want in THIRD-PARTY-NOTICES.md licenses/scowl/Copyright licenses/fonts/opendyslexic/OFL.txt; do
            grep -q "/$want\$" <<< "$listing" || { echo "the package lacks $want"; exit 1; }
          done
      # The GUI's textweaver.app in a zip, universal (Apple silicon and
      # Intel, joined with lipo), in the same build folder as the terminal
      # package.
      - name: Build the GUI package
        run: cargo xtask gui-dist --universal
      # --version, a screenshot drawn on the CPU, and a silent reading with
      # the paced backend in a window kept in the background (as
      # gui-xilem.yml's smoke run does), then the window closes itself.
      - name: Check the GUI package
        run: |
          for zip in target/dist/textweaver-*-macos-universal-gui.zip; do
            test -f "$zip" || { echo "Fail: no GUI package"; exit 1; }
            listing=$(unzip -Z1 "$zip")
            for want in textweaver.app/Contents/MacOS/textweaver-gui textweaver.app/Contents/Info.plist GUI.md lexicon/lexicon-en.twlex THIRD-PARTY-NOTICES.md licenses/scowl/Copyright licenses/xilem/LICENSE; do
              grep -q "/$want\$" <<< "$listing" || { echo "Fail: the GUI package lacks $want"; exit 1; }
            done
            echo "GUI package: $(basename "$zip"), $(du -m "$zip" | cut -f1) MB" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          for app in target/dist/textweaver-*-macos-universal-gui/textweaver.app; do
            codesign --verify --deep --verbose "$app"
            gui="$app/Contents/MacOS/textweaver-gui"
            lipo -info "$gui"
            for arch in arm64 x86_64; do
              lipo "$gui" -verify_arch "$arch" || { echo "Fail: the GUI lacks $arch"; exit 1; }
            done
            "$gui" --version
            "$gui" --screenshot "$RUNNER_TEMP/gui-check.png" fixtures/sample.md
            test -s "$RUNNER_TEMP/gui-check.png"
            home=$(mktemp -d)
            status=0
            "$gui" fixtures/sample.md --backend paced --read --background \
              --exit-after 6 --home "$home" --log-file gui.log || status=$?
            cat gui.log
            test "$status" -eq 0
            grep -q "Reading at" gui.log
            grep -q "closed" gui.log
          done
      # Exactly the files this job uploads: none missing, no stray one.
      - name: The package files are exactly the expected ones
        run: cargo xtask release-assets --dir target/dist --platform macos
      - uses: actions/attest-build-provenance@v4
        if: env.DRY_RUN != 'true'
        with:
          subject-path: |
            target/dist/textweaver-*-macos-universal.tar.gz
            target/dist/textweaver-*-macos-universal-gui.zip
      - name: Upload to the release
        if: env.DRY_RUN != 'true'
        run: |
          tools/release-upload.sh --no-sums "$TAG" \
            target/dist/textweaver-*-macos-universal.tar.gz \
            target/dist/textweaver-*-macos-universal-gui.zip
      - name: Keep the packages (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-macos
          path: |
            target/dist/textweaver-*-macos-universal.tar.gz
            target/dist/textweaver-*-macos-universal-gui.zip

  linux:
    name: Linux AppImage and tarball, ${{ matrix.arch }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            distros: debian:stable fedora:latest archlinux:latest
          # GitHub's arm64 runner (free for public repositories). Arch
          # Linux publishes no official arm64 image, so aarch64 is checked
          # on Debian and Fedora.
          - arch: aarch64
            runner: ubuntu-22.04-arm
            distros: debian:stable fedora:latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DRY_RUN != 'true' && env.TAG || '' }}
      - name: Runner architecture
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}" || { echo "Fail: the runner is $(uname -m), not ${{ matrix.arch }}"; exit 1; }
      # Built in docker/appimage (Ubuntu 22.04, glibc 2.35), so the
      # packages run on older distributions too; the image downloads
      # appimagetool and the AppImage runtime for this architecture from
      # their GitHub releases and checks their SHA-256
      # (docker/appimage/fetch-tools.sh).
      - name: Build the AppImage and the tarball
        run: |
          docker build -t textweaver-appimage docker/appimage
          docker run --rm -v "$PWD:/work" -w /work --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e CARGO_TARGET_DIR=/work/target/linux \
            -e GITHUB_STEP_SUMMARY=/work/target/docs-summary.md \
            textweaver-appimage cargo xtask appimage --out /work/target/dist
          # Missing-guide warnings written inside the container reach the job summary.
          cat target/docs-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      # tw --version, tw backends (espeak unavailable without libespeak-ng,
      # available with it), tw text, --install and --uninstall, the
      # tarball, and install-linux.sh --release with each package.
      - name: Check the packages on ${{ matrix.distros }}
        env:
          DISTROS: ${{ matrix.distros }}
          ARCH: ${{ matrix.arch }}
        run: |
          # One image per word.
          # shellcheck disable=SC2086
          bash docker/appimage/test-distros.sh target/dist $DISTROS
      # The GUI's tarball and AppImage, in the same image and build folder
      # as the terminal packages (the AppImage tools and the pinned runtime
      # are in the image).
      - name: Build the GUI's AppImage and tarball
        run: |
          docker run --rm -v "$PWD:/work" -w /work --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e CARGO_TARGET_DIR=/work/target/linux \
            -e GITHUB_STEP_SUMMARY=/work/target/docs-summary-gui.md \
            textweaver-appimage cargo xtask gui-dist --out /work/target/dist
          # Missing-guide warnings written inside the container reach the job summary.
          cat target/docs-summary-gui.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      # In the build image (it has the ALSA library the GUI links): the
      # files are there, --version, a screenshot drawn on the CPU (no
      # display is needed), and the AppImage's --version. Not yet run on
      # other distributions.
      - name: Check the GUI packages
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e ARCH -e APPIMAGE_EXTRACT_AND_RUN=1 \
            textweaver-appimage bash -euc '
              for dir in target/dist/textweaver-*-linux-"$ARCH"-gui; do
                test -d "$dir" || { echo "Fail: no GUI package for $ARCH"; exit 1; }
                for want in textweaver-gui textweaver-eci-host textweaver-dectalk-host GUI.md lexicon/lexicon-en.twlex THIRD-PARTY-NOTICES.md licenses/scowl/Copyright licenses/xilem/LICENSE; do
                  test -e "$dir/$want" || { echo "Fail: the GUI package lacks $want"; exit 1; }
                done
                "$dir/textweaver-gui" --version
                "$dir/textweaver-gui" --screenshot /tmp/gui-check.png fixtures/sample.md
                test -s /tmp/gui-check.png
              done
              for tarball in target/dist/textweaver-*-linux-"$ARCH"-gui.tar.gz; do
                tar -tzf "$tarball" | grep -q "/textweaver-gui$" || { echo "Fail: the GUI tarball lacks textweaver-gui"; exit 1; }
              done
              for image in target/dist/textweaver-*-linux-"$ARCH"-gui.AppImage; do
                "$image" --version
              done
            '
      # The terminal tarball unpacked in a clean Debian container started
      # with --network none, as an unprivileged user with an empty home:
      # tools/package-smoke.sh (open a fixture, tw info, tw components
      # list, convert one file), then the AppImage's tw components list
      # and tw info. Nothing installed, nothing fetched.
      - name: Clean-container install, no network
        # bash with pipefail, so tee keeps the script's exit status.
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: bash tools/clean-install-smoke.sh target/dist debian:stable-slim | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Package summary
        run: |
          for f in target/dist/textweaver-*-linux-${{ matrix.arch }}.* target/dist/textweaver-*-linux-${{ matrix.arch }}-gui.*; do
            echo "Linux package: $(basename "$f"), $(du -m "$f" | cut -f1) MB" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      # Exactly the files this job uploads: none missing, no stray one.
      - run: rustup toolchain install
      - name: The package files are exactly the expected ones
        run: cargo xtask release-assets --dir target/dist --platform linux-${{ matrix.arch }}
      - uses: actions/attest-build-provenance@v4
        if: env.DRY_RUN != 'true'
        with:
          subject-path: |
            target/dist/textweaver-*-linux-${{ matrix.arch }}.AppImage
            target/dist/textweaver-*-linux-${{ matrix.arch }}.tar.gz
            target/dist/textweaver-*-linux-${{ matrix.arch }}-gui.AppImage
            target/dist/textweaver-*-linux-${{ matrix.arch }}-gui.tar.gz
      - name: Upload to the release
        if: env.DRY_RUN != 'true'
        run: |
          tools/release-upload.sh --no-sums "$TAG" \
            target/dist/textweaver-*-linux-${{ matrix.arch }}.AppImage \
            target/dist/textweaver-*-linux-${{ matrix.arch }}.AppImage.zsync \
            target/dist/textweaver-*-linux-${{ matrix.arch }}.tar.gz \
            target/dist/textweaver-*-linux-${{ matrix.arch }}-gui.AppImage \
            target/dist/textweaver-*-linux-${{ matrix.arch }}-gui.AppImage.zsync \
            target/dist/textweaver-*-linux-${{ matrix.arch }}-gui.tar.gz
      - name: Keep the packages (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-linux-${{ matrix.arch }}
          path: |
            target/dist/textweaver-*-linux-${{ matrix.arch }}.AppImage
            target/dist/textweaver-*-linux-${{ matrix.arch }}.tar.gz
            target/dist/textweaver-*-linux-${{ matrix.arch }}-gui.AppImage
            target/dist/textweaver-*-linux-${{ matrix.arch }}-gui.tar.gz

  checksums:
    name: SHA256SUMS.txt
    needs: [windows, macos, linux]
    # Not in a dry run: there is no release to sum.
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DRY_RUN != 'true' && env.TAG || '' }}
      # With no files, the script only rebuilds the checksums of every
      # package on the release, once, after all the packages are there.
      - name: Write the checksums
        run: tools/release-upload.sh "$TAG"
      - name: Fetch the checksums file
        run: gh release download "$TAG" --pattern SHA256SUMS.txt --dir sums
      # The published release holds exactly the expected assets: every
      # platform's packages, the .zsync files, and SHA256SUMS.txt, for
      # this tag's version, and nothing else.
      - run: rustup toolchain install
      - name: The release's assets are exactly the expected ones
        shell: bash
        run: |
          gh release view "$TAG" --json assets --jq '.assets[].name' > assets.txt
          cargo xtask release-assets --names assets.txt --version "${TAG#v}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: sums/SHA256SUMS.txt
