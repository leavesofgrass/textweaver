# The helper scripts in scripts/ (scripts/README.md): lint every shell and
# PowerShell script, dry-run the Linux installer on Debian, Fedora, and Arch
# and check each picks the right package manager and package names, dry-run
# the macOS script under macOS's own bash 3.2 and the PowerShell scripts
# under Windows PowerShell 5.1 and PowerShell 7.
#
# A real source build takes longer than 20 minutes on a hosted runner, so
# the full install test is a manual job: run the workflow from the Actions
# tab and tick "Run a real source install".

name: Scripts

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tools/*.sh'
      - 'tools/*.ps1'
      - 'docker/appimage/*.sh'
      - '.github/workflows/scripts.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tools/*.sh'
      - 'tools/*.ps1'
      - 'docker/appimage/*.sh'
      - '.github/workflows/scripts.yml'
  workflow_dispatch:
    inputs:
      build:
        description: Run a real source install in Debian (about 30 minutes)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck scripts/*.sh tools/*.sh scripts/linux/AppRun docker/appimage/*.sh
      - name: Menu entry
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q desktop-file-utils
          desktop-file-validate scripts/linux/textweaver.desktop

  psscriptanalyzer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: PSScriptAnalyzer (scripts and tools; warnings fail)
        shell: pwsh
        run: |
          # -Path takes one folder, so each is analysed in turn.
          $findings = @(foreach ($dir in 'scripts', 'tools') {
            Invoke-ScriptAnalyzer -Path $dir -Recurse -Severity Warning, Error
          })
          $findings | Format-Table -AutoSize ScriptName, Line, Severity, RuleName, Message | Out-String -Width 300
          if ($findings.Count -gt 0) { throw "$($findings.Count) PSScriptAnalyzer findings" }
      - name: PSScriptAnalyzer (other .ps1 files; report only)
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.ps1 | Where-Object { $_.FullName -notmatch '[\\/](scripts|tools|target)[\\/]' }
          foreach ($f in $files) {
            Invoke-ScriptAnalyzer -Path $f.FullName -Severity Warning, Error |
              Format-Table -AutoSize ScriptName, Line, RuleName, Message | Out-String -Width 300
          }
      - name: Dry runs in Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($s in 'install-windows', 'update', 'doctor', 'speech-check', 'dev-check') {
            Write-Output "== $s.ps1 -DryRun -Yes"
            & powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\$s.ps1" -DryRun -Yes
            if ($LASTEXITCODE -ne 0) { throw "$s.ps1 failed" }
          }
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install-windows.ps1 --dry-run --yes --from-source
          if ($LASTEXITCODE -ne 0) { throw 'install-windows.ps1 --from-source failed' }
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install-windows.ps1 -DryRun -Yes -Uninstall
          if ($LASTEXITCODE -ne 0) { throw 'install-windows.ps1 -Uninstall failed' }
      - name: Dry runs in PowerShell 7
        shell: pwsh
        run: |
          foreach ($s in 'install-windows', 'doctor', 'speech-check') {
            Write-Output "== $s.ps1 -DryRun -Yes"
            & pwsh -NoProfile -File "scripts\$s.ps1" -DryRun -Yes
            if ($LASTEXITCODE -ne 0) { throw "$s.ps1 failed" }
          }

  linux-dry-run:
    name: install-linux.sh on ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:stable
            manager: 'Package manager: apt'
            packages: 'apt-get install -y -q --no-install-recommends -o Dpkg::Progress-Fancy=0 build-essential pkg-config libasound2-dev espeak-ng libespeak-ng-dev speech-dispatcher speech-dispatcher-espeak-ng libspeechd-dev'
          - image: fedora:latest
            manager: 'Package manager: dnf'
            packages: 'dnf install -y gcc gcc-c++ make pkgconf-pkg-config alsa-lib-devel espeak-ng espeak-ng-devel speech-dispatcher speech-dispatcher-espeak-ng speech-dispatcher-utils speech-dispatcher-devel'
          - image: archlinux:latest
            manager: 'Package manager: pacman'
            packages: 'pacman -Syu --needed --noconfirm --noprogressbar base-devel pkgconf alsa-lib espeak-ng speech-dispatcher'
    steps:
      - uses: actions/checkout@v7
      - name: Dry run
        shell: bash
        run: |
          bash scripts/install-linux.sh --dry-run --yes | tee dry-run.txt
          grep -F -- '${{ matrix.manager }}' dry-run.txt
          grep -F -- '${{ matrix.packages }}' dry-run.txt
          grep -F -- 'cargo build --release --locked -p textweaver-tui -p textweaver-cli --bin textweaver --bin tw --features textweaver-cli/espeak' dry-run.txt
          grep -F -- 'cargo xtask hosts' dry-run.txt
      - name: Uninstall dry run, and the other scripts
        shell: bash
        run: |
          bash scripts/install-linux.sh --dry-run --yes --uninstall
          bash scripts/install-linux.sh --dry-run --yes --release v0.1.0-alpha.4 | tee release.txt
          grep -F 'textweaver-0.1.0-alpha.4-linux-x86_64' release.txt
          grep -F 'SHA256SUMS.txt' release.txt
          bash scripts/install-linux.sh --dry-run --yes --release v0.1.0-alpha.4 --appimage | grep -F 'linux-x86_64.AppImage'
          bash scripts/install-linux.sh --dry-run --yes --release latest | grep -F 'api.github.com'
          bash scripts/doctor.sh --dry-run
          bash scripts/speech-check.sh --dry-run
          bash scripts/dev-check.sh --dry-run
          bash scripts/update.sh --dry-run --yes

  macos-dry-run:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Dry runs under /bin/bash (3.2)
        run: |
          /bin/bash --version | head -n 1
          /bin/bash scripts/install-macos.sh --dry-run --yes
          /bin/bash scripts/install-macos.sh --dry-run --yes --release v0.1.0-alpha.4
          /bin/bash scripts/install-macos.sh --dry-run --yes --from-source
          /bin/bash scripts/install-macos.sh --dry-run --yes --uninstall
          /bin/bash scripts/doctor.sh
          /bin/bash scripts/speech-check.sh --dry-run
          /bin/bash scripts/dev-check.sh --dry-run
          /bin/bash scripts/update.sh --dry-run --yes

  linux-install:
    name: Real source install (Debian)
    if: github.event_name == 'workflow_dispatch' && inputs.build
    runs-on: ubuntu-latest
    container: debian:stable
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install
        shell: bash
        run: bash scripts/install-linux.sh --yes --no-optional
      - name: Check
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          tw --version
          textweaver --version
          tw backends
          ls "$HOME/.local/lib/textweaver"
          bash "$HOME/.local/share/textweaver/scripts/doctor.sh"
      - name: Run again, then uninstall
        shell: bash
        run: |
          bash scripts/install-linux.sh --yes --no-optional --no-deps
          bash scripts/install-linux.sh --yes --uninstall
          test ! -e "$HOME/.local/lib/textweaver"
