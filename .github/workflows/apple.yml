# macOS-only voice tests and measurements for the Apple speech backends
# (textweaver-apple, ADR-0008). Runs on Agent F's branch only, on both
# macOS 14 and macOS 15 runners (ci.yml covers macos-latest). Nothing is
# played aloud: live speech runs at volume 0 or into a silent output, and
# files go to temporary directories. The Swift probes in
# tools/avspeech-spike/ can be run by hand with `swift <file>`.
name: Apple speech

on:
  push:
    branches: ['agent/f-apple']

env:
  CARGO_TERM_COLOR: always

jobs:
  apple:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Voice tests and measurements
        env:
          TEXTWEAVER_APPLE: '1'
        run: cargo test -p textweaver-apple -- --ignored --nocapture --test-threads=1
