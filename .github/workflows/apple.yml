# macOS-only voice tests and measurements for the Apple speech backends
# (textweaver-apple, ADR-0008), on an older and a newer macOS runner, when
# the Apple crate changes. ci.yml already runs these tests on macos-latest
# on every push; this workflow adds macOS 14 and the measurements printed
# with --nocapture. Nothing is played aloud: live speech runs at volume 0 or
# into a silent output, and files go to temporary directories. The Swift
# probes in tools/avspeech-spike/ can be run by hand with `swift <file>`.
name: Apple speech

on:
  push:
    branches: [main]
    paths:
      - 'crates/textweaver-apple/**'
      - '.github/workflows/apple.yml'
  pull_request:
    paths:
      - 'crates/textweaver-apple/**'
      - '.github/workflows/apple.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  apple:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Voice tests and measurements
        env:
          TEXTWEAVER_APPLE: '1'
        run: cargo test --locked -p textweaver-apple -- --ignored --nocapture --test-threads=1
