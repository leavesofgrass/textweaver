# Dependency updates, once a week, grouped so each ecosystem opens at most a
# few pull requests. CI (and cargo-deny) must pass before any is merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # ammonia stays on 4.1 until scraper moves to html5ever 0.40, so one
      # HTML parser is linked (root Cargo.toml). Lift this with scraper.
      - dependency-name: ammonia
        versions: ['>=4.2']
      # The GUI stack is pinned as a whole (ADR-0027) and moves together,
      # by hand: a single upgrade would link two graphics stacks.
      - dependency-name: 'wgpu*'
      - dependency-name: 'vello*'
      - dependency-name: 'imaging_vello*'
      - dependency-name: 'masonry*'
      - dependency-name: 'parley'
      - dependency-name: 'accesskit*'
      # MathCAT is pinned to a release candidate on purpose (ADR-0029);
      # its development builds are not wanted.
      - dependency-name: mathcat
      # sha1 0.11 needs digest 0.11 while sha2 is on 0.10.
      - dependency-name: sha1
        versions: ['>=0.11']
    groups:
      # Patch and minor updates of every crate together.
      cargo-minor:
        patterns: ['*']
        update-types: [minor, patch]
      # Major updates one pull request each (the default), so a breaking
      # change is reviewed on its own.
    commit-message:
      prefix: deps
