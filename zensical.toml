# Zensical checks links in the Markdown sources, before the
# textweaver_site_links extension below points links outside docs/ at
# GitHub, so it reports every link to CONTRIBUTING.md, CHANGELOG.md, and
# scripts/ as broken. tools/check_site_a11y.py --built checks every link and
# anchor in the built site instead, and tools/check_links.py checks the
# sources.
[project.validation]
invalid_links = false
invalid_link_anchors = false

[project.theme]
language = "en"
# No web fonts: the site uses the reader's own system fonts and makes no
# request to a font service.
font = false
features = [
  # Copy buttons on code blocks, with a spoken name.
  "content.code.copy",
  # Previous and next links at the foot of each page.
  "navigation.footer",
  # Every section of the navigation starts open, so nothing is hidden
  # behind a collapsed group.
  "navigation.expand",
  # Section index pages, and the breadcrumb path above each title.
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  # A "Back to top" button.
  "navigation.top",
]
# Left out on purpose, for screen readers and the keyboard:
# navigation.instant (page changes without a real page load, which some
# screen readers do not announce), navigation.tracking (rewrites the
# address while you read), search.highlight and content.tooltips.

# Light and dark follow the system first; the toggle cycles through
# system, light, and dark. Each toggle has a spoken name.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Color theme: follow the system. Switch to light"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Color theme: light. Switch to dark"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Color theme: dark. Switch to follow the system"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
# Headings keep their ids, without a pilcrow link after each one: screen
# readers announce those as a stream of unnamed "link" stops.
toc.permalink = false
# Heading ids as GitHub makes them, so links written for GitHub work here.
toc.slugify.object = "pymdownx.slugs.slugify"
toc.slugify.kwds.case = "lower"
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences = {}
# Task lists stay real, labeled check boxes, not drawn icons.
pymdownx.tasklist.custom_checkbox = false
textweaver_site_links.repo_blob = "https://github.com/leavesofgrass/textweaver/blob/main/"
textweaver_site_links.repo_tree = "https://github.com/leavesofgrass/textweaver/tree/main/"
# Every table gets a caption from the heading above it, visually hidden,
# so screen readers can name each table (tools/zensical_ext).
textweaver_site_tables = {}
