# The textweaver documentation site, built with Zensical from docs/.
#
# Build it with:  py -3 tools/build_site.py      (Windows)
#                 python3 tools/build_site.py    (Linux, macOS)
# The script runs Zensical, places the interactive pages, and checks the
# result for accessibility. The Zensical version is pinned in
# tools/site-requirements.txt. See docs/dev/building.md for more.
#
# The navigation below mirrors docs/README.md: users, contributors, and
# decisions, then the interactive pages. When a guide or an ADR is added to
# docs/README.md, add it here too.

[project]
site_name = "textweaver"
site_description = "textweaver, an accessible document reader and writer, in Rust."
site_url = "https://leavesofgrass.github.io/textweaver/"
repo_url = "https://github.com/leavesofgrass/textweaver"
repo_name = "leavesofgrass/textweaver"
edit_uri = "blob/main/docs/"
docs_dir = "docs"
site_dir = "target/docs-site"
copyright = "textweaver is free software. The documentation is part of the textweaver repository."

# Styles that fix accessibility details of the theme: focus outlines,
# underlined links, and text labels that do not depend on color.
extra_css = ["assets/textweaver-site.css"]
# Names, states, and announcements the theme leaves out: button roles and
# expanded states in the navigation, aria-current, one navigation landmark,
# and a labeled search box that announces its result count.
extra_javascript = ["assets/textweaver-site.js"]

