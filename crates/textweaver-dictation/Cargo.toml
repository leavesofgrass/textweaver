[package]
name = "textweaver-dictation"
description = "Voice typing for textweaver: dictation trait, Whisper in-process on RTen, and a whisper subprocess fallback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
autobins = false

# A fake whisper program for the integration tests: behaves like
# whisper.cpp's `whisper-cli` or the openai-whisper / whisper-ctranslate2
# command line, reading a script from its "audio" file.
[[bin]]
name = "tw-fake-whisper"
path = "src/bin/fake_whisper.rs"
test = false
doc = false

[features]
default = []
# Whisper in-process on RTen, the pure-Rust ONNX runtime (ADR-0023), with
# onnx-community's int8 models; silence skipped with earshot, audio
# resampled with rubato.
rten = [
    "dep:rten",
    "dep:rten-tensor",
    "dep:rten-generate",
    "dep:rten-text",
    "dep:rustfft",
    "dep:rubato",
    "dep:earshot",
]
# The microphone, through rodio's recording feature (cpal underneath),
# resampled to 16 kHz with rubato.
mic = ["dep:rodio", "dep:rubato", "dep:earshot"]

[dependencies]
textweaver-core.workspace = true
thiserror.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
rten = { workspace = true, optional = true }
rten-tensor = { workspace = true, optional = true }
rten-generate = { workspace = true, optional = true }
rten-text = { workspace = true, optional = true }
rustfft = { workspace = true, optional = true }
rubato = { workspace = true, optional = true }
earshot = { workspace = true, optional = true }
rodio = { workspace = true, optional = true, features = ["recording"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
