[package]
name = "textweaver-dictation"
description = "Voice typing for textweaver: dictation trait and a whisper subprocess backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
autobins = false

# A fake whisper program for the integration tests: behaves like
# whisper.cpp's `whisper-cli` or the openai-whisper / whisper-ctranslate2
# command line, reading a script from its "audio" file.
[[bin]]
name = "tw-fake-whisper"
path = "src/bin/fake_whisper.rs"
test = false
doc = false

[dependencies]
textweaver-core.workspace = true
thiserror.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
