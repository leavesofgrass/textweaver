# Light: Star's original light theme.
#
# Ported from Star's `light` palette (star/themes.py).
# Error color: the color Star's terminal table used for errors (#a1239b).
# Changed to meet the contrast floor (smallest lightness change that passes):
#   colors.dim_text: #8c8fa1 -> #6f7284 (3.0 to 1 -> 4.5 to 1 against #fafafa, needs 4.5 to 1)
#   colors.heading2: #209fb5 -> #007f95 (3.0 to 1 -> 4.5 to 1 against #fafafa, needs 4.5 to 1)
#   colors.heading4: #e64553 -> #d63547 (3.7 to 1 -> 4.5 to 1 against #fafafa, needs 4.5 to 1)
#   colors.code: #40a02b -> #167e00 (2.9 to 1 -> 4.5 to 1 against #eceff4, needs 4.5 to 1)
#
# Generated by `cargo run -p textweaver-theme --example generate_builtin_themes`.
# To make your own theme, copy this file into your themes folder under a new
# name and change theme.name; see docs/themes.md.

[theme]
name = "light"
display_name = "Light"
kind = "light"
description = "Star's original light theme."
author = "Star palettes (star/themes.py); ported to textweaver"
origin = "star"
counterpart = "dark"

[colors]
background = "#fafafa"
surface = "#eceff4"
text = "#24273a"
dim_text = "#6f7284"
heading1 = "#1e66f5"
heading2 = "#007f95"
heading3 = "#8839ef"
heading4 = "#d63547"
heading5 = "#d63547"
heading6 = "#d63547"
link = "#1e66f5"
code = "#167e00"
code_background = "#eceff4"
quote = "#6f7284"
error = "#a1239b"

[styles.selection]
foreground = "#24273a"
background = "#bcd0f0"
attributes = ["reverse"]

[styles.spoken_word]
foreground = "#fafafa"
background = "#1e66f5"
attributes = ["bold"]

[styles.spoken_sentence]
foreground = "#24273a"
background = "#bcd0f0"
attributes = ["underline"]

[styles.find_hit]
foreground = "#fafafa"
background = "#8839ef"
attributes = ["underline"]

[styles.current_find_hit]
foreground = "#fafafa"
background = "#007f95"
attributes = ["bold", "underline"]

[styles.bookmark]
foreground = "#d63547"
background = "none"
attributes = ["bold", "underline"]

[styles.note]
foreground = "#167e00"
background = "none"
attributes = ["italic", "underline"]

[styles.status_bar]
foreground = "#fafafa"
background = "#1e66f5"
attributes = ["bold"]

[styles.focus]
foreground = "#fafafa"
background = "#1e66f5"
attributes = ["bold"]

[[user_highlights]]
name = "yellow"
foreground = "#24273a"
background = "#fceda6"
attributes = ["bold"]

[[user_highlights]]
name = "green"
foreground = "#24273a"
background = "#b5e8c2"
attributes = ["bold"]

[[user_highlights]]
name = "blue"
foreground = "#24273a"
background = "#a6d1fc"
attributes = ["bold"]

[[user_highlights]]
name = "pink"
foreground = "#24273a"
background = "#fcc4db"
attributes = ["bold"]
