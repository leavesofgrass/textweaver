# Dark: Star's original dark theme.
#
# Ported from Star's `dark` palette (star/themes.py).
# Error color: the color Star's terminal table used for errors (#f07cd0).
# Changed to meet the contrast floor (smallest lightness change that passes):
#   colors.dim_text: #5c6370 -> #79818e (2.9 to 1 -> 4.5 to 1 against #16181d, needs 4.5 to 1)
#
# Generated by `cargo run -p textweaver-theme --example generate_builtin_themes`.
# To make your own theme, copy this file into your themes folder under a new
# name and change theme.name; see docs/themes.md.

[theme]
name = "dark"
display_name = "Dark"
kind = "dark"
description = "Star's original dark theme."
author = "Star palettes (star/themes.py); ported to textweaver"
origin = "star"
counterpart = "light"

[colors]
background = "#16181d"
surface = "#1e2128"
text = "#c6ccd4"
dim_text = "#79818e"
heading1 = "#82aaff"
heading2 = "#89ddff"
heading3 = "#c792ea"
heading4 = "#f78c6c"
heading5 = "#f78c6c"
heading6 = "#f78c6c"
link = "#82aaff"
code = "#7fdbab"
code_background = "#1e2128"
quote = "#79818e"
error = "#f07cd0"

[styles.selection]
foreground = "#c6ccd4"
background = "#2c313a"
attributes = ["reverse"]

[styles.spoken_word]
foreground = "#16181d"
background = "#82aaff"
attributes = ["bold"]

[styles.spoken_sentence]
foreground = "#c6ccd4"
background = "#2c313a"
attributes = ["underline"]

[styles.find_hit]
foreground = "#16181d"
background = "#c792ea"
attributes = ["underline"]

[styles.current_find_hit]
foreground = "#16181d"
background = "#89ddff"
attributes = ["bold", "underline"]

[styles.bookmark]
foreground = "#f78c6c"
background = "none"
attributes = ["bold", "underline"]

[styles.note]
foreground = "#7fdbab"
background = "none"
attributes = ["italic", "underline"]

[styles.status_bar]
foreground = "#16181d"
background = "#82aaff"
attributes = ["bold"]

[styles.focus]
foreground = "#16181d"
background = "#82aaff"
attributes = ["bold"]

[[user_highlights]]
name = "yellow"
foreground = "#c6ccd4"
background = "#5c5117"
attributes = ["bold"]

[[user_highlights]]
name = "green"
foreground = "#c6ccd4"
background = "#1f4d2f"
attributes = ["bold"]

[[user_highlights]]
name = "blue"
foreground = "#c6ccd4"
background = "#123861"
attributes = ["bold"]

[[user_highlights]]
name = "pink"
foreground = "#c6ccd4"
background = "#5c2d45"
attributes = ["bold"]
