# Everforest Dark: Soft green forest palette.
#
# Ported from Star's `everforest-dark` palette (star/themes.py).
# Error color: Star's terminal error color (xterm 167, #d75f5f).
# Changed to meet the contrast floor (smallest lightness change that passes):
#   colors.error: #d75f5f -> #f17674 (3.3 to 1 -> 4.5 to 1 against #2d353b, needs 4.5 to 1)
#
# Generated by `cargo run -p textweaver-theme --example generate_builtin_themes`.
# To make your own theme, copy this file into your themes folder under a new
# name and change theme.name; see docs/themes.md.

[theme]
name = "everforest-dark"
display_name = "Everforest Dark"
kind = "dark"
description = "Soft green forest palette."
author = "Star palettes (star/themes.py); ported to textweaver"
origin = "star"

[colors]
background = "#2d353b"
surface = "#232a2e"
text = "#d3c6aa"
dim_text = "#a4b0a0"
heading1 = "#a7c080"
heading2 = "#83c092"
heading3 = "#7fbbb3"
heading4 = "#dbbc7f"
heading5 = "#dbbc7f"
heading6 = "#dbbc7f"
link = "#7fbbb3"
code = "#e69875"
code_background = "#232a2e"
quote = "#a4b0a0"
error = "#f17674"

[styles.selection]
foreground = "#d3c6aa"
background = "#475258"
attributes = ["reverse"]

[styles.spoken_word]
foreground = "#2d353b"
background = "#a7c080"
attributes = ["bold"]

[styles.spoken_sentence]
foreground = "#d3c6aa"
background = "#475258"
attributes = ["underline"]

[styles.find_hit]
foreground = "#2d353b"
background = "#7fbbb3"
attributes = ["underline"]

[styles.current_find_hit]
foreground = "#2d353b"
background = "#83c092"
attributes = ["bold", "underline"]

[styles.bookmark]
foreground = "#dbbc7f"
background = "none"
attributes = ["bold", "underline"]

[styles.note]
foreground = "#e69875"
background = "none"
attributes = ["italic", "underline"]

[styles.status_bar]
foreground = "#2d353b"
background = "#a7c080"
attributes = ["bold"]

[styles.focus]
foreground = "#2d353b"
background = "#7fbbb3"
attributes = ["bold"]

[[user_highlights]]
name = "yellow"
foreground = "#d3c6aa"
background = "#5b541a"
attributes = ["bold"]

[[user_highlights]]
name = "green"
foreground = "#d3c6aa"
background = "#2b5d41"
attributes = ["bold"]

[[user_highlights]]
name = "blue"
foreground = "#d3c6aa"
background = "#234d76"
attributes = ["bold"]

[[user_highlights]]
name = "pink"
foreground = "#d3c6aa"
background = "#6c425a"
attributes = ["bold"]
