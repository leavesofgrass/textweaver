# One Light: The One Light editor palette.
#
# Ported from Star's `one-light` palette (star/themes.py).
# Error color: the scheme's red (#e45649); Star had no error color.
# Changed to meet the contrast floor (smallest lightness change that passes):
#   colors.dim_text: #a0a1a7 -> #727379 (2.4 to 1 -> 4.5 to 1 against #fafafa, needs 4.5 to 1)
#   colors.heading1: #4078f2 -> #356ce5 (3.8 to 1 -> 4.5 to 1 against #fafafa, needs 4.5 to 1)
#   colors.heading3: #0184bc -> #007ab2 (4.0 to 1 -> 4.5 to 1 against #fafafa, needs 4.5 to 1)
#   colors.heading4: #50a14f -> #318332 (3.0 to 1 -> 4.5 to 1 against #fafafa, needs 4.5 to 1)
#   colors.link: #4078f2 -> #356ce5 (3.8 to 1 -> 4.5 to 1 against #fafafa, needs 4.5 to 1)
#   colors.error: #e45649 -> #ce4237 (3.5 to 1 -> 4.5 to 1 against #fafafa, needs 4.5 to 1)
#   colors.code: #c18401 -> #975d00 (2.6 to 1 -> 4.5 to 1 against #eaeaeb, needs 4.5 to 1)
#
# Generated by `cargo run -p textweaver-theme --example generate_builtin_themes`.
# To make your own theme, copy this file into your themes folder under a new
# name and change theme.name; see docs/themes.md.

[theme]
name = "one-light"
display_name = "One Light"
kind = "light"
description = "The One Light editor palette."
author = "Star palettes (star/themes.py); ported to textweaver"
origin = "star"
counterpart = "one-dark"

[colors]
background = "#fafafa"
surface = "#eaeaeb"
text = "#383a42"
dim_text = "#727379"
heading1 = "#356ce5"
heading2 = "#a626a4"
heading3 = "#007ab2"
heading4 = "#318332"
heading5 = "#318332"
heading6 = "#318332"
link = "#356ce5"
code = "#975d00"
code_background = "#eaeaeb"
quote = "#727379"
error = "#ce4237"

[styles.selection]
foreground = "#383a42"
background = "#dbdbdc"
attributes = ["reverse"]

[styles.spoken_word]
foreground = "#fafafa"
background = "#356ce5"
attributes = ["bold"]

[styles.spoken_sentence]
foreground = "#383a42"
background = "#dbdbdc"
attributes = ["underline"]

[styles.find_hit]
foreground = "#fafafa"
background = "#007ab2"
attributes = ["underline"]

[styles.current_find_hit]
foreground = "#fafafa"
background = "#a626a4"
attributes = ["bold", "underline"]

[styles.bookmark]
foreground = "#318332"
background = "none"
attributes = ["bold", "underline"]

[styles.note]
foreground = "#975d00"
background = "none"
attributes = ["italic", "underline"]

[styles.status_bar]
foreground = "#fafafa"
background = "#356ce5"
attributes = ["bold"]

[styles.focus]
foreground = "#fafafa"
background = "#356ce5"
attributes = ["bold"]

[[user_highlights]]
name = "yellow"
foreground = "#383a42"
background = "#fceda6"
attributes = ["bold"]

[[user_highlights]]
name = "green"
foreground = "#383a42"
background = "#b5e8c2"
attributes = ["bold"]

[[user_highlights]]
name = "blue"
foreground = "#383a42"
background = "#a6d1fc"
attributes = ["bold"]

[[user_highlights]]
name = "pink"
foreground = "#383a42"
background = "#fcc4db"
attributes = ["bold"]
