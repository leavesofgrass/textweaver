[package]
name = "textweaver-cli"
description = "tw: the textweaver command line (extract, search, speak, convert, export audio, cite, library, vault, dictate, settings, JSON-RPC)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "tw"
path = "src/main.rs"

[features]
default = []
# Speech engines, passed through to textweaver-speech.
espeak = ["textweaver-app/espeak"]
omnivox = ["textweaver-app/omnivox"]
speechd = ["textweaver-app/speechd"]

[dependencies]
textweaver-app.workspace = true
# In-process `tw open` and `tw serve`.
textweaver-tui.workspace = true
textweaver-vault.workspace = true
textweaver-dictation.workspace = true
textweaver-export.workspace = true
# Agent L: `tw convert`.
textweaver-convert.workspace = true
textweaver-writers.workspace = true
textweaver-render.workspace = true
# Agent P: `tw cite`.
textweaver-cite.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
