[package]
name = "textweaver-cli"
description = "tw: textweaver's terminal program, the terminal reader and the command line (extract, search, speak, convert, export audio, cite, library, vault, dictate, settings, JSON-RPC), as a library that the textweaver program runs, with a terminal-only binary for development"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# The terminal program alone, without the app: `tw` alone or `tw FILE`
# opens the terminal reader, and `tw COMMAND` runs a command headless
# (B1-o1). For development, the tests, and the Docker image; the packages
# ship the one program, `textweaver` (crates/textweaver-xilem), which runs
# this library with `--tw`, and `tw` as a link or launcher for it.
[[bin]]
name = "tw"
path = "src/bin/tw.rs"

[features]
default = ["opus", "carta", "cw-midi", "mqtt"]
# `tw cw monitor` and CW keying in the reader read MIDI key adapters (the
# TinyMIDI, the CTR2 MIDI) through midir, in textweaver-app; on Windows
# through its WinRT backend, which also sees Bluetooth LE MIDI devices.
# On in releases.
cw-midi = ["textweaver-app/cw-midi"]
# Live sources over MQTT in the terminal reader, and `tw broker` and
# `tw publish` (beta 5); on in releases.
mqtt = [
    "textweaver-app/mqtt",
    "textweaver-tui/mqtt",
    "dep:textweaver-mqtt",
    "dep:textweaver-broker",
    "dep:textweaver-qr",
    "dep:ctrlc",
]
# carta (B1-k2): `tw convert`, `tw text`, and the reader read Org,
# reStructuredText, MediaWiki, DokuWiki (`--from dokuwiki`), and Jira
# (`--from jira`) in process, ahead of Pandoc, and `tw convert --to` writes
# AsciiDoc, Typst, LaTeX, MediaWiki, and Org. On by default.
carta = ["textweaver-app/carta", "textweaver-convert/carta", "textweaver-tui/carta"]
# `tw export-audio --out x.opus` in process with libopus (W7o; building it
# needs cmake). Off, Opus goes through ffmpeg.
opus = ["textweaver-export/opus"]
# Speech engines, passed through to textweaver-speech.
espeak = ["textweaver-app/espeak", "textweaver-engines/espeak"]
omnivox = ["textweaver-app/omnivox", "textweaver-engines/omnivox"]
speechd = ["textweaver-app/speechd", "textweaver-engines/speechd"]
# MathCAT math speech (ADR-0029), and Nemeth or UEB math in BRF files
# (ADR-0036).
mathcat = [
    "textweaver-app/mathcat",
    "textweaver-engines/mathcat",
    "textweaver-convert/mathcat",
    "textweaver-writers/mathcat",
]

[dependencies]
textweaver-app = { workspace = true, features = ["publish", "lint", "grammar", "dictation", "audio-export"] }
# The speech backend registry (`tw backends`, `speak`, `voices`, `export-audio`).
textweaver-engines.workspace = true
# Host mode (`tw --engine-host <engine>`): `tw` runs the engine hosts.
textweaver-host.workspace = true
# In-process `tw open` and `tw serve`.
textweaver-tui.workspace = true
textweaver-vault.workspace = true
# Whisper in-process on RTen and the microphone (ADR-0023).
textweaver-dictation = { workspace = true, features = ["rten", "mic"] }
textweaver-export = { workspace = true, features = ["flac", "id3", "mp3", "read-along", "vorbis", "video"] }
# Agent L: `tw convert`.
textweaver-convert.workspace = true
textweaver-writers.workspace = true
textweaver-render.workspace = true
# Agent P: `tw cite`.
textweaver-cite.workspace = true
# Agent W3d: `tw ocr` (model downloads) and opening web addresses.
textweaver-ocr = { workspace = true, features = ["download"] }
textweaver-formats = { workspace = true, features = ["url"] }
clap.workspace = true
anyhow.workspace = true
# crossterm, through ratatui: `tw cw monitor` reads key presses and releases.
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
# Beta 5, phase 5a: `tw broker` and `tw publish` (the `mqtt` feature).
# ctrlc stops the broker and the publishing loop cleanly.
textweaver-mqtt = { workspace = true, optional = true }
textweaver-broker = { workspace = true, optional = true }
# Beta 5, phase 7c: `tw join-qr IMAGE`, and `--qr FILE` on `tw broker` and
# `tw publish` (the `mqtt` feature).
textweaver-qr = { workspace = true, optional = true }
ctrlc = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
# `tw publish` against a broker inside the test program.
textweaver-broker.workspace = true
textweaver-mqtt.workspace = true
textweaver-enginehost.workspace = true
textweaver-espeak.workspace = true

[lints]
workspace = true
