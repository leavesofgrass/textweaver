[package]
name = "textweaver-export"
description = "Audio and subtitle export for textweaver: WAV, FLAC, MP3, Ogg Opus, Ogg Vorbis, M4B and karaoke MP4 video via ffmpeg, SRT/VTT cues, chapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["flac", "id3", "mp3", "opus", "vorbis", "read-along", "video"]
# Passed through so the container can export with espeak-ng in tests.
espeak = ["textweaver-speech/espeak"]
# FLAC written in process (pure Rust), with tags and chapters as Vorbis
# comments.
flac = ["dep:flacenc"]
# MP3 written in process with LAME (LGPL, built from bundled source and
# linked statically), with ID3v2 tags and chapters. Without it, MP3 goes
# through ffmpeg.
mp3 = ["dep:mp3lame-encoder", "id3"]
# Ogg Opus written in process with libopus (BSD-3-Clause, built from bundled
# source with cmake and linked statically), mono at a speech bit rate, with
# tags and chapters as Vorbis comments in the OpusTags header. Without it,
# Opus goes through ffmpeg, and building needs no cmake.
opus = ["dep:opusic-c", "dep:rubato"]
# Ogg Vorbis written in process with libvorbis and libogg (BSD-3-Clause,
# built from bundled source with cc and linked statically; no cmake), at the
# file's own rate and channels, with tags and chapters as Vorbis comments.
# Without it, Ogg Vorbis goes through ffmpeg.
vorbis = ["dep:vorbis_rs"]
# ID3v2 tags and chapters (CHAP and CTOC) in WAV files.
id3 = ["dep:id3"]
# The read-along page: one offline HTML file with the text, the MP3 inside,
# and word-synced highlighting (the writers' sync spans, the page rules,
# and the theme's CSS).
read-along = ["dep:textweaver-writers", "dep:textweaver-render", "dep:textweaver-theme"]
# The karaoke video (MP4 through ffmpeg): frames drawn in process with the
# bundled reading font and the 2D rasterizer hayro already brings
# (vello_cpu), so nothing new is built.
video = ["dep:hayro", "dep:textweaver-fonts"]

[dependencies]
textweaver-core.workspace = true
textweaver-text.workspace = true
textweaver-speech.workspace = true
# The components folder, searched first for ffmpeg.
textweaver-store.workspace = true
thiserror.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
flacenc = { workspace = true, optional = true }
id3 = { workspace = true, optional = true }
mp3lame-encoder = { workspace = true, optional = true }
opusic-c = { workspace = true, optional = true }
vorbis_rs = { workspace = true, optional = true }
rubato = { workspace = true, optional = true, features = ["fft_resampler"] }
textweaver-writers = { workspace = true, optional = true }
textweaver-render = { workspace = true, optional = true }
textweaver-theme = { workspace = true, optional = true }
hayro = { workspace = true, optional = true }
textweaver-fonts = { workspace = true, optional = true }

[dev-dependencies]
claxon.workspace = true
symphonia.workspace = true
id3.workspace = true

[lints]
workspace = true
