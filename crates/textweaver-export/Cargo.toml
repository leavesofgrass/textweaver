[package]
name = "textweaver-export"
description = "Audio and subtitle export for textweaver: WAV, MP3/M4B via ffmpeg, SRT/VTT cues, chapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["flac", "id3"]
# Passed through so the container can export with espeak-ng in tests.
espeak = ["textweaver-speech/espeak"]
# FLAC written in process (pure Rust), with tags and chapters as Vorbis
# comments.
flac = ["dep:flacenc"]
# ID3v2 tags and chapters (CHAP and CTOC) in WAV files.
id3 = ["dep:id3"]

[dependencies]
textweaver-core.workspace = true
textweaver-text.workspace = true
textweaver-speech.workspace = true
thiserror.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
flacenc = { workspace = true, optional = true }
id3 = { workspace = true, optional = true }

[dev-dependencies]
claxon.workspace = true
id3.workspace = true

[lints]
workspace = true
