[package]
name = "textweaver-engines"
description = "textweaver speech engines: the backend registry every frontend shares (built-ins, Eloquence, SAPI5, Apple, DECtalk, Piper), engine options from the settings, and the speech service configuration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# Downloading Piper voices (HTTP through ureq). The app turns it on with
# its `publish` feature, so the lean reader links no HTTP client.
piper-download = ["textweaver-piper/download"]
# In-process engines, passed through to textweaver-speech.
espeak = ["textweaver-speech/espeak"]
omnivox = ["textweaver-speech/omnivox"]
speechd = ["textweaver-speech/speechd"]
# MathCAT math speech (ADR-0029), passed through to textweaver-speech.
mathcat = ["textweaver-speech/mathcat"]

[dependencies]
textweaver-core.workspace = true
textweaver-speech.workspace = true
textweaver-store.workspace = true
textweaver-eci.workspace = true
# The output device for the engines whose audio textweaver plays
# (`[speech] output_device`).
textweaver-enginehost.workspace = true
textweaver-sapi.workspace = true
textweaver-dectalk.workspace = true
# eSpeak NG in its helper program; the `espeak` feature adds the
# in-process backend beside it.
textweaver-espeak.workspace = true
textweaver-apple.workspace = true
# Piper neural voices in-process on RTen (ADR-0023): phonemes from an
# installed libespeak-ng, else the built-in pure-Rust port. Downloads
# (checked by hash) are the `piper-download` feature.
textweaver-piper = { workspace = true, features = ["playback", "espeak-lib", "espeak-rs"] }

[lints]
workspace = true
