[package]
name = "textweaver-sapi"
description = "Windows SAPI5 voices for textweaver: host process (x64 and x86) and speech backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "textweaver-sapi-host"
path = "src/bin/textweaver-sapi-host.rs"

[features]
default = ["playback"]
# Audio output through rodio (Windows only). The host process does not need
# it: `cargo xtask sapi-host` builds the hosts with `--no-default-features`.
playback = ["dep:rodio"]

[dependencies]
textweaver-core.workspace = true
textweaver-speech.workspace = true
thiserror.workspace = true
log.workspace = true

[target.'cfg(windows)'.dependencies]
rodio = { workspace = true, optional = true, features = ["playback"] }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Speech",
    "Win32_System_Com",
    "Win32_System_Threading",
] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
