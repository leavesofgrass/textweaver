# /etc/mosquitto/conf.d/netlog.conf: a conf.d drop-in with a plain and a
# TLS listener, for textweaver-mqtt's tests. Inside the container only;
# the test publishes both ports on 127.0.0.1.
log_dest stdout

listener 1883

listener 8883
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl
