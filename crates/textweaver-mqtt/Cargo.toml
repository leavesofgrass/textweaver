[package]
name = "textweaver-mqtt"
description = "MQTT 3.1.1 client for textweaver's live documents: a receive-only source on one std thread and a small blocking publisher, on rumqttc's packet codec and textweaver's own rustls with ring (bundled roots, a CA file, or a pinned key and join codes), with reconnect and backoff, and caps and sanitizing of every payload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# No other textweaver crate. The app adapts MqttEvent to its own LiveEvent.
[dependencies]
rumqttc.workspace = true
bytes.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
webpki-roots.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The loopback test broker (tests/support) runs a tokio runtime; the
# client itself starts none. Certificates are made at test time.
tokio.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true

[lints]
workspace = true
