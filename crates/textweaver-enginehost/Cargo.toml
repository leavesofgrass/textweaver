[package]
name = "textweaver-enginehost"
description = "Shared engine-host protocol and playback client for out-of-process speech engines (ECI, SAPI, DECtalk)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Audio output through rodio. Off by default so the host processes (built
# with `--no-default-features` by `cargo xtask hosts`) never link an audio
# stack; the engine crates turn it on through their own `playback` feature.
playback = ["dep:rodio"]

[dependencies]
textweaver-core.workspace = true
textweaver-speech.workspace = true
thiserror.workspace = true
log.workspace = true
rodio = { workspace = true, optional = true, features = ["playback"] }
# Decodes the recorded audio of DAISY books (MP3 and WAV; MPL-2.0, approved
# by the owner on Friday, October 9, 2026).
symphonia.workspace = true

# Hosts join a kill-on-close Job Object, so they never outlive textweaver.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[[test]]
name = "host_process"
harness = false

[lints]
workspace = true
