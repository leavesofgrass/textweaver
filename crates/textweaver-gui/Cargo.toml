[package]
name = "textweaver-gui"
description = "textweaver native GUI on wxDragon: the Wave 2 feasibility spike (ADR-0014), not built by default"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# Not a default member: wxDragon builds wxWidgets from source (CMake and a C++
# toolchain). Build with `cargo build -p textweaver-gui`.

[[bin]]
name = "textweaver-gui"
path = "src/main.rs"

[dependencies]
textweaver-app = { workspace = true, features = ["publish"] }
textweaver-aids.workspace = true
textweaver-fonts = { workspace = true, features = ["bundled-fonts"] }
wxdragon.workspace = true
live-region.workspace = true
clap.workspace = true

[lints]
workspace = true
