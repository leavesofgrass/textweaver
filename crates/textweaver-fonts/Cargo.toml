[package]
name = "textweaver-fonts"
description = "Fonts for textweaver: bundled Atkinson Hyperlegible Next and Mono and OpenDyslexic (SIL OFL 1.1), and installed fonts found by family name"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["bundled-fonts"]
# Embed the fonts under third_party/fonts/ (1.3 MB) with include_bytes!.
# Without it, BUNDLED is empty and callers fall back to installed fonts.
bundled-fonts = []

[dependencies]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
