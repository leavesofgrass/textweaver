[package]
name = "textweaver-convert"
description = "Fast bulk document conversion for textweaver: parallel, incremental, mirrored output trees"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Math in BRF output as Nemeth or UEB braille through MathCAT (ADR-0036).
mathcat = ["textweaver-writers/mathcat"]
# carta (B1-k2): Org, reStructuredText, MediaWiki, DokuWiki, and Jira read
# in process, and AsciiDoc, Typst, LaTeX, MediaWiki, and Org written. Off
# here; `tw`, the terminal reader, and the app turn it on.
carta = ["textweaver-formats/carta"]

[dependencies]
textweaver-core.workspace = true
textweaver-text.workspace = true
textweaver-formats = { workspace = true, features = ["pandoc", "bibliography"] }
textweaver-render.workspace = true
textweaver-writers.workspace = true
textweaver-cite.workspace = true
textweaver-math.workspace = true
pulldown-cmark.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
rayon.workspace = true
walkdir.workspace = true
notify.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
