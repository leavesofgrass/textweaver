[package]
name = "textweaver-aids"
description = "Reading aids for textweaver: RSVP, bionic reading, syllable splitting, reading level, text spacing, reading ruler, difficult words"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
textweaver-core.workspace = true
textweaver-text.workspace = true
serde.workspace = true
thiserror.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
textweaver-fonts.workspace = true
zip = { workspace = true, optional = true }

[features]
default = ["scowl", "bundled-fonts"]
# The built-in SCOWL word levels (third_party/scowl/, 692 KB compressed)
# for difficult-word marking with no download.
scowl = ["dep:zip"]
# Bundled reading fonts count as installed when resolving a font choice.
bundled-fonts = ["textweaver-fonts/bundled-fonts"]

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
toml.workspace = true

[lints]
workspace = true
