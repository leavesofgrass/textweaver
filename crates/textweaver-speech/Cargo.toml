[package]
name = "textweaver-speech"
description = "textweaver speech: backend trait, speech service, pacing, queue, normalization, engines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
autobins = false

# A fake Omnivox server for the omnivox integration tests (records the
# protocol lines it receives). Built only with the `omnivox` feature.
[[bin]]
name = "tw-fake-omnivox"
path = "src/bin/fake_omnivox.rs"
required-features = ["omnivox"]
test = false
doc = false

[features]
default = []
# In-process espeak-ng. libespeak-ng is loaded at run time with libloading
# (hand-written declarations in src/backends/espeak/sys.rs), never linked:
# building needs no espeak-ng headers, and one binary works with or without
# libespeak-ng installed (the backend is then unavailable).
espeak = ["espeak-phonemes"]
# libespeak-ng loaded the same way, for its text-to-phonemes call only
# (Piper voices, textweaver-piper). Registers no espeak-ng backend.
espeak-phonemes = ["dep:libloading"]
# Omnivox subprocess backend (Emacspeak speech-server protocol on stdin).
omnivox = []
# speech-dispatcher through its SSIP socket, with SSML index marks for word
# events (pure Rust; no libspeechd).
speechd = []
# Wave 2: the `tts` crate (WinRT, AVSpeech, speech-dispatcher).
tts-crate = []
# Math spoken by MathCAT (ClearSpeak and SimpleSpeak) when the math engine
# setting asks for it (ADR-0029). Off, that setting reads math with
# textweaver-math, as always.
mathcat = ["dep:textweaver-mathcat"]

[dependencies]
textweaver-core.workspace = true
textweaver-math.workspace = true
textweaver-mathcat = { workspace = true, optional = true }
bitflags.workspace = true
serde.workspace = true
thiserror.workspace = true
log.workspace = true
regex.workspace = true
encoding_rs.workspace = true
libloading = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
serde_json.workspace = true

[lints]
workspace = true
