[package]
name = "textweaver-speech"
description = "textweaver speech: backend trait, speech service, pacing, queue, normalization, engines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# In-process espeak-ng (links libespeak-ng; see docker/Dockerfile).
espeak = []
# Omnivox subprocess backend (Emacspeak speech-server protocol on stdin).
omnivox = []
# Wave 2: speech-dispatcher with index marks.
speechd = []
# Wave 2: the `tts` crate (WinRT, AVSpeech, speech-dispatcher).
tts-crate = []

[dependencies]
textweaver-core.workspace = true
bitflags.workspace = true
serde.workspace = true
thiserror.workspace = true
log.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
