[package]
name = "textweaver-speech"
description = "textweaver speech: backend trait, speech service, pacing, queue, normalization, engines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
autobins = false

# A fake Omnivox server for the omnivox integration tests (records the
# protocol lines it receives). Built only with the `omnivox` feature.
[[bin]]
name = "tw-fake-omnivox"
path = "src/bin/fake_omnivox.rs"
required-features = ["omnivox"]
test = false
doc = false

[features]
default = []
# In-process espeak-ng (links libespeak-ng; see docker/Dockerfile).
espeak = ["dep:espeakng-sys"]
# Omnivox subprocess backend (Emacspeak speech-server protocol on stdin).
omnivox = []
# speech-dispatcher through its SSIP socket, with SSML index marks for word
# events (pure Rust; no libspeechd).
speechd = []
# Wave 2: the `tts` crate (WinRT, AVSpeech, speech-dispatcher).
tts-crate = []

[dependencies]
textweaver-core.workspace = true
textweaver-math.workspace = true
bitflags.workspace = true
serde.workspace = true
thiserror.workspace = true
log.workspace = true
regex.workspace = true
encoding_rs.workspace = true
espeakng-sys = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
serde_json.workspace = true

[lints]
workspace = true
