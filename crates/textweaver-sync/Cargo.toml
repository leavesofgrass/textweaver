[package]
name = "textweaver-sync"
description = "textweaver sync: a hybrid logical clock, merge types, one record per document, and the sync folder in which each computer writes only its own files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
textweaver-core.workspace = true
textweaver-store.workspace = true
serde.workspace = true
# float_roundtrip: numbers are parsed correctly rounded, so a value in a
# field this version does not know (kept for a newer textweaver, ADR-0049)
# writes back and reads again exactly, however large. Not
# arbitrary_precision, which serde cannot read numbers through in the
# store's structs with flattened unknown fields.
serde_json = { workspace = true, features = ["float_roundtrip"] }
# SHA-256 of a file's bytes and of its text, for recognizing a document
# on another computer (ADR-0049). Pure Rust.
sha2.workspace = true
thiserror.workspace = true
log.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
