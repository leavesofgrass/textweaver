[package]
name = "textweaver-xilem"
description = "textweaver's all-Rust GUI on Masonry (Xilem's widget layer), Vello, Parley, AccessKit, and winit (ADR-0027)"
version.workspace = true
edition.workspace = true
rust-version = "1.96"
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# Not a default member yet: Vello and wgpu add a few minutes to a cold build.
# Build with `cargo build -p textweaver-xilem`. It becomes `textweaver-gui`
# once it passes the UI Automation report (ADR-0027).

[[bin]]
name = "textweaver-xilem"
path = "src/main.rs"

[features]
default = ["screenshot", "renderer-vello", "publish", "lint"]
# The renderer: Vello's GPU compute renderer (the default), or Vello's
# hybrid renderer (CPU strips, simple GPU shaders), which suits software
# GPUs such as Mesa's llvmpipe under Xvfb in CI. With both, Vello wins.
renderer-vello = ["masonry_winit/imaging_vello"]
renderer-hybrid = ["masonry_winit/imaging_vello_hybrid"]
# `--screenshot PATH`: render the window with the Vello CPU renderer, with no
# window on screen (masonry_testing's harness).
screenshot = ["dep:masonry_testing"]
# Citations while writing, export (HTML, PDF, DOCX, EPUB, BRF), and the
# browser preview, from the app (ADR-0033). On by default since edit mode:
# they are what writing in the window needs.
publish = ["textweaver-app/publish"]
# Markdown lint in edit mode (Ctrl+F8 and Ctrl+Shift+F8 find the
# problems), as in the terminal reader: textweaver's own rules, no
# dependencies.
lint = ["textweaver-app/lint"]
# Grammar checking in edit mode with harper-core, off by default as in the
# terminal reader (it adds about 10 MB).
grammar = ["textweaver-app/grammar"]
# MathCAT math speech and navigation (ADR-0029), as in the terminal reader.
mathcat = ["textweaver-app/mathcat"]
# Speech engines that need a system library, passed through to the app's
# engines as the terminal reader's features are: eSpeak NG, Speech
# Dispatcher (Linux), and Omnivox. Release packages turn them on where the
# library is found (`cargo xtask gui-dist`).
espeak = ["textweaver-app/espeak"]
speechd = ["textweaver-app/speechd"]
omnivox = ["textweaver-app/omnivox"]

[dependencies]
textweaver-app.workspace = true
textweaver-theme.workspace = true
textweaver-fonts = { workspace = true, features = ["bundled-fonts"] }
masonry.workspace = true
masonry_winit.workspace = true
masonry_testing = { workspace = true, optional = true }
unicode-segmentation.workspace = true
serde_json.workspace = true
# The `[gui]` table's `graphics` key, read before the window starts.
toml.workspace = true
clap.workspace = true
rfd.workspace = true

# `--announce uia` (W4s): UI Automation Notification events raised directly.
# The same `windows` crate and features AccessKit's Windows adapter already
# builds, so nothing new is compiled.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    # W6a5: the system's colors in Windows High Contrast (GetSysColor).
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    # W4a3: no console window; attach to the terminal it was started from.
    "Win32_System_Console",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    # W4a3: a startup error with no terminal is shown in a message box.
    "Win32_UI_WindowsAndMessaging",
] }
windows-core.workspace = true

[dev-dependencies]
accesskit_consumer.workspace = true
masonry_testing.workspace = true
tempfile.workspace = true

[lints]
workspace = true
