[package]
name = "textweaver-eci"
description = "ETI-Eloquence for textweaver: ECI engine host process and speech backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "textweaver-eci-host"
path = "src/bin/textweaver-eci-host.rs"

[features]
default = ["playback"]
# Audio output through rodio. The host process does not need it:
# `cargo xtask eci-host` builds the host with `--no-default-features`.
playback = ["dep:rodio"]

[dependencies]
textweaver-core.workspace = true
textweaver-speech.workspace = true
thiserror.workspace = true
log.workspace = true
libloading.workspace = true
rodio = { workspace = true, optional = true, features = ["playback"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
