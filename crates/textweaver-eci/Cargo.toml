[package]
name = "textweaver-eci"
description = "ETI-Eloquence for textweaver: ECI engine host process and speech backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "textweaver-eci-host"
path = "src/bin/textweaver-eci-host.rs"

[features]
default = ["playback"]
# Audio output through rodio (in textweaver-enginehost). The host process
# does not need it: `cargo xtask hosts` builds the host with
# `--no-default-features`.
playback = ["textweaver-enginehost/playback"]

[dependencies]
textweaver-core.workspace = true
textweaver-speech.workspace = true
# The components folder, searched first for the ECI library.
textweaver-store.workspace = true
textweaver-enginehost.workspace = true
thiserror.workspace = true
log.workspace = true
libloading.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
