[package]
name = "textweaver-components"
description = "textweaver's optional components: files pinned by size and SHA-256, one downloader (a .part file, the hash, then a rename), install from a zip or a folder, and a mirror's manifest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# Downloads over HTTPS (ureq with rustls). Off by default, so the lean
# reader links no HTTP client: without it only a mirror that is a folder
# on this computer, and Install from a file, work.
# It also brings the credential store for a private components source.
download = ["dep:ureq", "dep:keyring"]

[dependencies]
thiserror.workspace = true
log.workspace = true
serde.workspace = true
toml.workspace = true
# Checking files against their pins: SHA-256, and git's blob SHA-1 for the
# small files Hugging Face keeps in git (Piper voices).
sha2.workspace = true
sha1.workspace = true
# Install from a downloaded zip (already in the tree through the formats).
zip.workspace = true
# The `unpack` action (pandoc for Linux) and unpacking an update: gzip
# tarballs; the zip packages use `zip` above.
tar.workspace = true
flate2.workspace = true
ureq = { workspace = true, optional = true }
# Release lists (GitHub's API answers in JSON): a private repository's,
# and textweaver's own for updates.
serde_json.workspace = true
# The GitHub token asked for once, kept only in the system credential store.
keyring = { workspace = true, optional = true }
# Finding and running `gh auth token` with no console window.
textweaver-core.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
