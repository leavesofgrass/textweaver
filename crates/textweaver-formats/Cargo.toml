[package]
name = "textweaver-formats"
description = "textweaver document loaders: loader trait, registry, text, Markdown with Obsidian notes, HTML, EPUB, DOCX, RTF, ODT, LaTeX, email, web archives, PDF with OCR, DAISY, braille (BRF) files, PowerPoint, spreadsheets, archives, JSON and notebooks, SVG, MathML, web pages, and Pandoc for other formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["pdf", "ocr", "archives", "spreadsheets"]
# PDF loader (pure Rust, on lopdf; ADR-0010). On by default.
pdf = ["dep:lopdf"]
# OCR for scanned PDF pages and image files (ADR-0026): the pure-Rust ocrs
# engine in process, Tesseract as a separate program for other languages.
ocr = ["images", "textweaver-ocr/ocrs"]
# The picture loader (PNG and JPEG) and the PDF loader's scanned-page path,
# without the in-process ocrs engine: recognition goes to Tesseract when it
# is installed, and otherwise the document says what is missing. For the
# fuzz targets, which would otherwise compile the engine (and RTen) under
# the sanitizer; `ocr` turns this on.
images = ["pdf", "dep:textweaver-ocr"]
# Tar, tar.gz, and 7z archives (zip is always read).
archives = ["dep:tar", "dep:sevenz-rust2", "dep:flate2"]
# Excel workbooks (XLSX, XLSM, XLSB) through calamine; CSV, TSV, and ODS
# need nothing.
spreadsheets = ["dep:calamine"]
# Opening a web page or file by its http or https address. Off by default:
# it brings an HTTP client (ureq with rustls), which the reader keeps out
# (`cargo xtask deps`); `tw` turns it on.
url = ["dep:ureq"]
# Reserved: paperback-core (pdfium, mathcat) is not on crates.io, so this
# feature enables nothing (ADR-0010).
paperback = []
# Pandoc subprocess loader for the long tail (odt, rtf, rst, org, latex, ...).
pandoc = []
# LaTeX's `\bibliography` and `\printbibliography` read through
# textweaver-cite: the cited entries of the `.bib` files, formatted. Off by
# default: the citation stack stays out of the lean reader (`cargo xtask
# deps`); textweaver-convert turns it on, so `tw` and the reader's publish
# feature have it.
bibliography = ["dep:textweaver-cite"]

[dependencies]
textweaver-core.workspace = true
textweaver-text.workspace = true
thiserror.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
ropey.workspace = true
pulldown-cmark.workspace = true
scraper.workspace = true
toml.workspace = true
encoding_rs.workspace = true
zip.workspace = true
roxmltree.workspace = true
mail-parser.workspace = true
directories.workspace = true
lopdf = { workspace = true, optional = true }
# The engine only through the `ocr` feature (`textweaver-ocr/ocrs`). A path,
# not `workspace = true`: the workspace entry keeps its default features
# for the other crates, and Cargo does not let a member turn them off.
textweaver-ocr = { path = "../textweaver-ocr", optional = true, default-features = false }
tar = { workspace = true, optional = true }
sevenz-rust2 = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
calamine = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
textweaver-cite = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
proptest.workspace = true

[lints]
workspace = true
