[package]
name = "textweaver-formats"
description = "textweaver document loaders: loader trait, registry, text, Markdown, HTML, EPUB, DOCX, PDF with OCR, DAISY, PowerPoint, spreadsheets, archives, web pages, and Pandoc for other formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["pdf", "ocr", "archives", "spreadsheets", "url"]
# PDF loader (pure Rust, on lopdf; ADR-0010). On by default.
pdf = ["dep:lopdf"]
# OCR for scanned PDF pages and image files (ADR-0023): the pure-Rust ocrs
# engine in process, Tesseract as a separate program for other languages.
ocr = ["pdf", "dep:textweaver-ocr"]
# Tar, tar.gz, and 7z archives (zip is always read).
archives = ["dep:tar", "dep:sevenz-rust2", "dep:flate2"]
# XLSX, XLS, XLSB, and ODS spreadsheets (CSV and TSV need nothing).
spreadsheets = ["dep:calamine"]
# Opening a web page or file by its http or https address.
url = ["dep:ureq"]
# Reserved: paperback-core (pdfium, mathcat) is not on crates.io, so this
# feature enables nothing (ADR-0010).
paperback = []
# Pandoc subprocess loader for the long tail (odt, rtf, rst, org, latex, ...).
pandoc = []

[dependencies]
textweaver-core.workspace = true
textweaver-text.workspace = true
thiserror.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
ropey.workspace = true
pulldown-cmark.workspace = true
scraper.workspace = true
toml.workspace = true
encoding_rs.workspace = true
zip.workspace = true
roxmltree.workspace = true
directories.workspace = true
lopdf = { workspace = true, optional = true }
textweaver-ocr = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
sevenz-rust2 = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
calamine = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
proptest.workspace = true

[lints]
workspace = true
