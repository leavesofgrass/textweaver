[package]
name = "textweaver-formats"
description = "textweaver document loaders: loader trait, registry, text, Markdown, HTML, EPUB, DOCX, PDF, and Pandoc for other formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["pdf"]
# PDF loader (pure Rust, on lopdf; ADR-0010). On by default.
pdf = ["dep:lopdf"]
# Reserved: paperback-core (pdfium, mathcat) is not on crates.io, so this
# feature enables nothing (ADR-0010).
paperback = []
# Pandoc subprocess loader for the long tail (odt, rtf, rst, org, latex, ...).
pandoc = []

[dependencies]
textweaver-core.workspace = true
textweaver-text.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
ropey.workspace = true
pulldown-cmark.workspace = true
scraper.workspace = true
toml.workspace = true
encoding_rs.workspace = true
zip.workspace = true
roxmltree.workspace = true
lopdf = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
proptest.workspace = true

[lints]
workspace = true
