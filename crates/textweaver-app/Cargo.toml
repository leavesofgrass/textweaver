[package]
name = "textweaver-app"
description = "textweaver application core: state, sessions, command dispatch, effects (UI-agnostic)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["publish", "lint", "grammar", "dictation", "audio-export", "opus", "carta", "mqtt"]
# Export audio from the reader (Agent W6v, ADR-0011): FLAC, MP3, Ogg Vorbis
# (W9x-o) and WAV in process, M4B through ffmpeg when it is found. Off, the Export audio
# command stays hidden.
audio-export = [
    "dep:textweaver-export",
    "textweaver-export/flac",
    "textweaver-export/id3",
    "textweaver-export/mp3",
    "textweaver-export/read-along",
    "textweaver-export/vorbis",
    "textweaver-export/video",
]
# Opus in process in Export audio, with libopus (W7o; building it needs
# cmake). Off, Opus goes through ffmpeg like M4B.
opus = ["audio-export", "textweaver-export/opus"]
# Dictation in edit mode (Agent W6d, ADR-0042): Whisper in-process on
# RTen with the microphone. Off, the Dictate command stays hidden.
dictation = ["dep:textweaver-dictation"]
# CW keying from MIDI key adapters (the TinyMIDI, the CTR2 MIDI) through
# midir, and `tw cw monitor`'s MIDI; on Windows through its WinRT
# backend, which also sees Bluetooth LE MIDI devices. On in releases
# (through textweaver-cli's `cw-midi`).
cw-midi = ["dep:midir"]
# Markdown lint in edit mode (Agent W4g, ADR-0032): textweaver's own
# rules on the parser the app already uses; no dependencies.
lint = []
# Grammar checking in edit mode with harper-core (Agent W4g, ADR-0032).
# On by default since Wave 7 (W7g); it adds about 11 MB and the burn
# framework. Off, Ctrl+F7 says grammar checking is not in this build.
grammar = ["dep:harper-core"]
# In-reader export (HTML, PDF, DOCX, EPUB, BRF), the browser preview, and
# citations (insert, look up, check, read aloud). On by default and in
# releases. Off, the app links none of the conversion and citation stack
# (convert, render, writers, cite, and hayagriva, comrak, minijinja,
# krilla, ammonia, ureq), and those commands say they are not in this
# build; `cargo xtask deps --check` holds the reader to that. It also
# brings Piper voice downloads and the Lexend download, the other uses of
# HTTP in the reader.
publish = [
    "dep:textweaver-cite",
    "dep:textweaver-convert",
    "dep:textweaver-render",
    "dep:textweaver-writers",
    # Contracted braille in BRF files and the Braille view.
    "textweaver-writers/liblouis",
    "textweaver-engines/piper-download",
    "textweaver-fonts/download",
    "textweaver-components/download",
]
# carta (B1-k2): Org, reStructuredText, MediaWiki, DokuWiki, and Jira
# opened in the reader in process, and AsciiDoc, Typst, LaTeX, MediaWiki,
# and Org offered in Batch convert (with `publish`). On by default in the
# terminal reader, `tw`, and the GUI; the lean reader leaves it out.
carta = ["textweaver-formats/carta", "textweaver-convert?/carta"]
# Live sources over MQTT (beta 5): the receive-only client and the
# system credential store for their passwords. On by default and in
# releases. Off, the commands that open, set up, or close a live source
# are hidden and say in words that live sources are not in this build;
# a saved live log still opens.
mqtt = ["dep:textweaver-mqtt", "textweaver-components/credentials"]
# Speech engines, passed through to textweaver-engines.
espeak = ["textweaver-engines/espeak"]
omnivox = ["textweaver-engines/omnivox"]
speechd = ["textweaver-engines/speechd"]
# MathCAT (ADR-0029, ADR-0036): math speech, passed through to
# textweaver-engines; exploring a formula with MathCAT's navigation and
# braille; and Nemeth or UEB math in exported BRF files.
mathcat = [
    "textweaver-engines/mathcat",
    "dep:textweaver-mathcat",
    "textweaver-convert?/mathcat",
]

[dependencies]
textweaver-core.workspace = true
textweaver-text.workspace = true
textweaver-formats.workspace = true
textweaver-speech.workspace = true
textweaver-store.workspace = true
# Obsidian vaults: the link resolver and the index (crate::vault).
textweaver-vault.workspace = true
# Document identity for sync (ADR-0049): sync ids found on the writer.
textweaver-sync.workspace = true
textweaver-keymap.workspace = true
textweaver-a11y.workspace = true
textweaver-editor.workspace = true
# The backend registry and every engine crate, through one crate.
textweaver-engines.workspace = true
# What CW is sending, for the status line (crate::cw).
textweaver-cw.workspace = true
textweaver-theme.workspace = true
textweaver-aids.workspace = true
# Downloading Lexend on first choice (W7l); HTTP only with `publish`.
textweaver-fonts.workspace = true
# Optional components (W8a-d): the registry's pins, the one downloader,
# and install from a file; HTTP only with `publish`.
textweaver-components.workspace = true
# The OCR model sets, listed in the components registry.
textweaver-ocr.workspace = true
textweaver-math.workspace = true
textweaver-mathcat = { workspace = true, optional = true }
textweaver-cite = { workspace = true, optional = true }
textweaver-convert = { workspace = true, optional = true }
textweaver-render = { workspace = true, optional = true }
# Save changes to the Word file (B1-t2): the review written into the
# original package in place; with `publish`, which already links it.
textweaver-writers = { workspace = true, optional = true }
# Agent W3e: define word and the message catalog.
textweaver-lexicon.workspace = true
# Agent W5s: summaries without a model (ADR-0037).
textweaver-summary.workspace = true
# Agent W6d: dictation in edit mode.
textweaver-dictation = { workspace = true, optional = true, features = ["rten", "mic"] }
# Agent W6v: audio export from the reader.
textweaver-export = { workspace = true, optional = true }
# Beta 5: live sources over MQTT (crate::live::mqtt).
textweaver-mqtt = { workspace = true, optional = true }
pulldown-cmark.workspace = true
# Anki packages (B1-f3): the SQLite collection, the zip, and the newest
# format's zstd collection; sha1 for the checksum Anki keeps per note.
rusqlite.workspace = true
zip.workspace = true
ruzstd.workspace = true
sha1.workspace = true
harper-core = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ropey.workspace = true
# Find and replace with regular expressions (B1-fr): captures and errors.
regex.workspace = true
thiserror.workspace = true
log.workspace = true
midir = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
# WinRT MIDI: the only Windows MIDI interface that lists Bluetooth LE
# MIDI devices (the TinyMIDI).
midir = { workspace = true, optional = true, features = ["winrt"] }
# GetLocalTime, for the local date in new documents from templates;
# GetLogicalDrives and GetDriveTypeW, for the file browser's drives (W6f);
# ShellExecuteW, to open links and files without a shell (W8a).
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
