[package]
name = "textweaver-app"
description = "textweaver application core: state, sessions, command dispatch, effects (UI-agnostic)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["publish"]
# In-reader export (HTML, PDF, DOCX, EPUB, BRF), the browser preview, and
# citations (insert, look up, check, read aloud). On by default and in
# releases. Off, the app links none of the conversion and citation stack
# (convert, render, writers, cite, and hayagriva, comrak, minijinja,
# krilla, ammonia, ureq), and those commands say they are not in this
# build; `cargo xtask deps --check` holds the reader to that.
publish = ["dep:textweaver-cite", "dep:textweaver-convert", "dep:textweaver-render"]
# Speech engines, passed through to textweaver-engines.
espeak = ["textweaver-engines/espeak"]
omnivox = ["textweaver-engines/omnivox"]
speechd = ["textweaver-engines/speechd"]

[dependencies]
textweaver-core.workspace = true
textweaver-text.workspace = true
textweaver-formats.workspace = true
textweaver-speech.workspace = true
textweaver-store.workspace = true
textweaver-keymap.workspace = true
textweaver-a11y.workspace = true
textweaver-editor.workspace = true
# The backend registry and every engine crate, through one crate.
textweaver-engines.workspace = true
textweaver-theme.workspace = true
textweaver-aids.workspace = true
textweaver-math.workspace = true
textweaver-cite = { workspace = true, optional = true }
textweaver-convert = { workspace = true, optional = true }
textweaver-render = { workspace = true, optional = true }
# Agent W3e: define word and the message catalog.
textweaver-lexicon.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
serde_json.workspace = true
ropey.workspace = true
thiserror.workspace = true
log.workspace = true

[target.'cfg(windows)'.dependencies]
# GetLocalTime, for the local date in new documents from templates.
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_SystemInformation"] }

# Export, preview, and citations are tested with the feature on.
[[test]]
name = "authoring"
required-features = ["publish"]

[[test]]
name = "citations_reading"
required-features = ["publish"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
