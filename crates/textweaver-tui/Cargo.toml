[package]
name = "textweaver-tui"
description = "textweaver terminal UI: self-voicing ratatui frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "textweaver"
path = "src/main.rs"

[features]
default = []
# Speech engines, passed through to textweaver-speech.
espeak = ["textweaver-app/espeak"]
omnivox = ["textweaver-app/omnivox"]
speechd = ["textweaver-app/speechd"]

[dependencies]
textweaver-app.workspace = true
textweaver-theme.workspace = true
ratatui.workspace = true
anyhow.workspace = true
clap.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
