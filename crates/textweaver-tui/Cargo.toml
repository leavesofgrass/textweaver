[package]
name = "textweaver-tui"
description = "textweaver terminal UI: self-voicing ratatui frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "textweaver"
path = "src/main.rs"

[features]
default = ["publish", "lint", "grammar", "clipboard", "highlight", "dictation", "audio-export", "opus"]
# Dictation in edit mode (textweaver-app's `dictation`, ADR-0042).
dictation = ["textweaver-app/dictation"]
# File, Export audio (textweaver-app's `audio-export`, W6v), as in the GUI
# and `tw`: without it the command is hidden from the menus and the
# palette. `--no-default-features` leaves it out, with the rest of the
# defaults.
audio-export = ["textweaver-app/audio-export"]
# Opus in process in Export audio (textweaver-app's `opus`, W7o; building
# it needs cmake). Off, Opus goes through ffmpeg like M4B.
opus = ["textweaver-app/opus"]
# In-reader export, preview, and citations (textweaver-app's `publish`).
# `--no-default-features` builds the lean reader without them.
publish = ["textweaver-app/publish"]
# Markdown lint in edit mode (textweaver-app's `lint`).
lint = ["textweaver-app/lint"]
# The system clipboard (arboard) where the terminal cannot take OSC 52:
# the old Windows console, macOS Terminal, VTE terminals (ADR-0032).
clipboard = ["dep:arboard"]
# Code blocks highlighted with syntect and bat's syntaxes (two-face),
# through textweaver-render's tokenizer, which the HTML pages share;
# colors from the theme's roles, never color alone (ADR-0032).
highlight = ["dep:textweaver-render"]
# Grammar checking with harper-core (textweaver-app's `grammar`). On by
# default and in releases since Wave 7 (the owner's decision); it adds
# about 11 MB and the burn framework. `--no-default-features` leaves it
# out, with the rest of the defaults.
grammar = ["textweaver-app/grammar"]
# Speech engines, passed through to textweaver-speech.
espeak = ["textweaver-app/espeak", "textweaver-engines/espeak"]
omnivox = ["textweaver-app/omnivox", "textweaver-engines/omnivox"]
speechd = ["textweaver-app/speechd", "textweaver-engines/speechd"]
# MathCAT math speech (ADR-0029).
mathcat = ["textweaver-app/mathcat", "textweaver-engines/mathcat"]

[dependencies]
textweaver-app.workspace = true
textweaver-engines.workspace = true
textweaver-theme.workspace = true
textweaver-aids.workspace = true
ratatui.workspace = true
anyhow.workspace = true
clap.workspace = true
ctrlc.workspace = true
log.workspace = true
unicode-bidi.workspace = true

arboard = { workspace = true, optional = true }
textweaver-render = { workspace = true, optional = true }

# Wayland as well as X11 for the system clipboard.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
arboard = { workspace = true, optional = true, features = ["wayland-data-control"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
