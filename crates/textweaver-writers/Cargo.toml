[package]
name = "textweaver-writers"
description = "Native document writers for textweaver: accessible EPUB 3, DOCX, BRF braille, tagged PDF"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
textweaver-core.workspace = true
textweaver-text.workspace = true
thiserror.workspace = true
serde.workspace = true
krilla.workspace = true
zip.workspace = true
# Reading a Word file's XML to write a review back in place (docx_update).
roxmltree.workspace = true
textweaver-fonts.workspace = true
textweaver-math.workspace = true
textweaver-mathcat = { workspace = true, optional = true }
textweaver-store = { workspace = true, optional = true }

[features]
default = ["bundled-fonts"]
# Contracted (grade 2) braille through liblouis's `lou_translate`, when it
# is installed (found in the components folder first, then the PATH).
liblouis = ["dep:textweaver-store"]
# Bundled fonts (Atkinson Hyperlegible Next and Mono, OpenDyslexic): PDF
# output needs no installed font, and EPUB can embed them.
bundled-fonts = ["textweaver-fonts/bundled-fonts"]
# Math in BRF files as Nemeth or UEB math braille through MathCAT
# (ADR-0036); without it, math is written as its spoken words.
mathcat = ["dep:textweaver-mathcat"]

[dev-dependencies]
ropey.workspace = true
serde_json.workspace = true
tempfile.workspace = true
textweaver-formats.workspace = true

[lints]
workspace = true
