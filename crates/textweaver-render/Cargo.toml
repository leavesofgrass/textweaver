[package]
name = "textweaver-render"
description = "Markdown to HTML with selectable engines and flavors (GFM, Obsidian, Pandoc), math as MathML, and MiniJinja templates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["comrak"]
# The comrak engine (`--engine comrak`). pulldown-cmark is the default
# engine and always built; without this feature `comrak` falls back to it
# with a warning. Release packages keep it on.
comrak = ["dep:comrak"]

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
pulldown-cmark.workspace = true
comrak = { workspace = true, optional = true }
textweaver-math.workspace = true
# Heading slugs, shared with the reader's link following.
textweaver-text.workspace = true
# The callout rules, shared with the reader's Markdown loader (ADR-0044).
# Without its default features: no PDF, OCR, archive, or workbook loaders.
textweaver-formats = { path = "../textweaver-formats", default-features = false }
ammonia.workspace = true
minijinja.workspace = true
# The theme's --tw-* properties, read by templates/style.css.
textweaver-theme.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
proptest.workspace = true

[lints]
workspace = true
