# Developer profile (example): a settings profile to import.
#
# Importing adds a profile named "Developer" and changes nothing else.
# Your settings change only when you switch to it.
#
#   tw settings profile import docs/examples/developer-profile.toml
#   tw settings profile switch "Developer"
#
# Settings: the Eloquence engine (eci) with the Reed voice at 400 words
# per minute, the Lexend font at 16 points, the Galaxy theme, and Opus for
# audio export. The settings guide (docs/settings.md, "Developer profile
# (example)") says more.

textweaver_profiles = 1

[profiles.Developer.speech]
backend = "eci"
voice = "Reed"
rate = 400

[profiles.Developer.display]
theme = "galaxy"

[profiles.Developer.export]
audio_format = "opus"

[profiles.Developer.reading_aids.font]
family = "lexend"
size_pt = 16.0
weight = 400
