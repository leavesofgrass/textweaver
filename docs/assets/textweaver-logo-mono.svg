<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="mono-title mono-desc">
<title id="mono-title">textweaver</title>
<desc id="mono-desc">The logo drawn in a single color, for inline use and favicons. A rounded square outline holds the loom frame: posts and beams as solid bars, thin warp threads between them, and the heavy t stem with its slanted top and diamond foot. The weft is a hollow outlined ribbon that zigzags across as a pointed w. The warp threads it passes over show through the hollow ribbon as lines; the ones it passes under stop at its edges, so the weaving still reads without a second color.</desc>
