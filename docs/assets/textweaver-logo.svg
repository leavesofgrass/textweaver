<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="loom-title loom-desc">
<title id="loom-title">textweaver</title>
<desc id="loom-desc">A square parchment badge with rounded corners holds a dark indigo loom: two side posts, a top beam and a bottom beam, with small rivets at the corners. Thin vertical warp threads run between the beams. A thick orange weft thread zigzags across them as a pointed letter W, passing over one warp thread and under the next. A heavy ink stem rises through the top beam down the middle, cut at a slant where it shows above the beam, and ends in a diamond foot, so stem and beam read as a lowercase t with the w woven through it: a tw monogram.</desc>
