# cargo-about: the Rust crates part of THIRD-PARTY-NOTICES.md.
# Regenerate the file with `cargo xtask notices` (it runs cargo about with
# about/crates.hbs and adds the data files; see xtask/src/notices.rs).
#
# The accepted licences are those compatible with GPL-3.0-or-later; keep
# this list in step with deny.toml.

accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]

# The platforms textweaver ships for, so the list does not depend on the
# machine that generates it.
targets = [
    "x86_64-pc-windows-msvc",
    "i686-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

# Only what ends up in the programs.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# textweaver's own crates (publish = false) are under LICENSE.
private = { ignore = true }
# Known licence layouts of widely used crates.
workarounds = ["ring", "rustls"]

# One licence for one crate, approved by the owner on Sunday, September 27,
# 2026 (W4c1). Mirrors the exception in deny.toml.
[libbz2-rs-sys]
accepted = ["bzip2-1.0.6"]
