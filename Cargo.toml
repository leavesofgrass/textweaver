[workspace]
resolver = "3"
members = [
    "crates/textweaver-core",
    "crates/textweaver-text",
    "crates/textweaver-formats",
    "crates/textweaver-speech",
    "crates/textweaver-store",
    "crates/textweaver-keymap",
    "crates/textweaver-a11y",
    "crates/textweaver-editor",
    "crates/textweaver-app",
    "crates/textweaver-tui",
    "crates/textweaver-cli",
    "crates/textweaver-eci",
    "crates/textweaver-apple",
    "crates/textweaver-sapi",
    "crates/textweaver-enginehost",
    "crates/textweaver-export",
    "crates/textweaver-vault",
    "crates/textweaver-dictation",
    "crates/textweaver-gui",
    "crates/textweaver-xilem",
    "crates/textweaver-render",
    "crates/textweaver-convert",
    "crates/textweaver-writers",
    "crates/textweaver-math",
    "crates/textweaver-cite",
    "crates/textweaver-theme",
    "crates/textweaver-aids",
    "crates/textweaver-dectalk",
    "crates/textweaver-fonts",
    "crates/textweaver-lexicon",
    "crates/textweaver-engines",
    "crates/textweaver-piper",
    "crates/textweaver-ocr",
    "xtask",
]
# The vendored Xilem and Masonry snapshot is its own workspace (ADR-0027).
exclude = ["third_party/xilem"]
default-members = [
    "crates/textweaver-core",
    "crates/textweaver-text",
    "crates/textweaver-formats",
    "crates/textweaver-speech",
    "crates/textweaver-store",
    "crates/textweaver-keymap",
    "crates/textweaver-a11y",
    "crates/textweaver-editor",
    "crates/textweaver-app",
    "crates/textweaver-tui",
    "crates/textweaver-cli",
    "crates/textweaver-eci",
    "crates/textweaver-apple",
    "crates/textweaver-sapi",
    "crates/textweaver-enginehost",
    "crates/textweaver-export",
    "crates/textweaver-vault",
    "crates/textweaver-dictation",
    "crates/textweaver-render",
    "crates/textweaver-convert",
    "crates/textweaver-writers",
    "crates/textweaver-math",
    "crates/textweaver-cite",
    "crates/textweaver-theme",
    "crates/textweaver-aids",
    "crates/textweaver-dectalk",
    "crates/textweaver-fonts",
    "crates/textweaver-lexicon",
    "crates/textweaver-engines",
    "crates/textweaver-piper",
    "crates/textweaver-ocr",
]

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/leavesofgrass/textweaver"
authors = ["Jon Pielaet"]
publish = false

# Every dependency any crate may use is declared here (ADR-0001). Crates opt in
# with `name.workspace = true` in their own Cargo.toml. Adding a crate to this
# table is an orchestrator decision; agents request it in their report.
[workspace.dependencies]
# internal
textweaver-core = { path = "crates/textweaver-core" }
textweaver-text = { path = "crates/textweaver-text" }
textweaver-formats = { path = "crates/textweaver-formats" }
textweaver-speech = { path = "crates/textweaver-speech" }
textweaver-store = { path = "crates/textweaver-store" }
textweaver-keymap = { path = "crates/textweaver-keymap" }
textweaver-a11y = { path = "crates/textweaver-a11y" }
textweaver-editor = { path = "crates/textweaver-editor" }
# Default features off, so a crate can build the app without `publish`
# (the lean reader); crates that want it say `features = ["publish"]`.
textweaver-app = { path = "crates/textweaver-app", default-features = false }
textweaver-tui = { path = "crates/textweaver-tui" }
textweaver-eci = { path = "crates/textweaver-eci" }
textweaver-apple = { path = "crates/textweaver-apple" }
textweaver-sapi = { path = "crates/textweaver-sapi" }
textweaver-enginehost = { path = "crates/textweaver-enginehost" }
textweaver-export = { path = "crates/textweaver-export" }
textweaver-vault = { path = "crates/textweaver-vault" }
textweaver-dictation = { path = "crates/textweaver-dictation" }
textweaver-render = { path = "crates/textweaver-render" }
textweaver-convert = { path = "crates/textweaver-convert" }
textweaver-writers = { path = "crates/textweaver-writers" }
textweaver-math = { path = "crates/textweaver-math" }
textweaver-cite = { path = "crates/textweaver-cite" }
textweaver-theme = { path = "crates/textweaver-theme" }
textweaver-aids = { path = "crates/textweaver-aids" }
textweaver-dectalk = { path = "crates/textweaver-dectalk" }
textweaver-fonts = { path = "crates/textweaver-fonts", default-features = false }
textweaver-lexicon = { path = "crates/textweaver-lexicon" }
textweaver-engines = { path = "crates/textweaver-engines" }
textweaver-piper = { path = "crates/textweaver-piper", default-features = false }
textweaver-ocr = { path = "crates/textweaver-ocr" }

# text and formats
ropey = "1.6"
unicode-segmentation = "1.13"
regex = "1.13"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
scraper = "0.27"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
roxmltree = "0.21"

# persistence
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
directories = "6"

# errors, flags, logging
thiserror = "2"
anyhow = "1"
bitflags = { version = "2", features = ["serde"] }
log = "0.4"

# frontends
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.30"

# Audio playback and export. speech-dispatcher (SSIP over its socket) and
# espeak-ng (hand-written declarations) need no crates here.
rodio = { version = "0.22", default-features = false }

# ETI-Eloquence host: runtime loading of the user-installed ECI library
libloading = "0.9"

# Apple speech (macOS only; used under cfg(target_os = "macos") in textweaver-apple)
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-avf-audio = "0.3"
block2 = "0.6"

# Windows SAPI5 (Windows only; used under cfg(windows) in textweaver-sapi)
windows = "0.62"

# Wave 2
# PDF loader (ADR-0010). Default features off: `chrono-clock` is unused.
# `rayon` stays for lopdf's parallel object parsing of large files; rayon is
# in the tree already through textweaver-convert.
lopdf = { version = "0.45", default-features = false, features = ["rayon"] }
# Character encodings (legacy HTML, Windows-1252 text).
encoding_rs = "0.8"
# Hot-folder watch for batch conversion.
notify = "8"
# Conversion and rendering (Agents L and M)
comrak = { version = "0.55", default-features = false }
minijinja = "2.24"
rayon = "1.12"
walkdir = "2.5"
# Held on 4.1 (security fixes still land there): 4.1.4 uses html5ever 0.39,
# the version scraper 0.27 uses, so one HTML parser is linked instead of
# two. Move to 4.2 together with a scraper release on html5ever 0.40.
ammonia = "~4.1.4"
krilla = "0.8"
# Citations (Agent P): bibliography model and CSL styles, BibTeX, blocking HTTP
hayagriva = "0.10"
biblatex = "0.12"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
# GUI (wave 3 spike; the textweaver-gui crate only). wxdragon has no default
# features today; they are off so none arrive unnoticed in an update.
wxdragon = { version = "0.9", default-features = false }
live-region = "0.3"
# The Xilem GUI (Wave 3, textweaver-xilem only; ADR-0027). Masonry is
# vendored from Xilem at revision 271a27a6d4a9 (Monday, September 14, 2026)
# under third_party/xilem, patched to AccessKit 0.25 and accesskit_winit 0.34
# so Orca detects the app. Default features off: the crate picks the Vello
# renderer itself.
masonry = { path = "third_party/xilem/masonry", default-features = false }
masonry_winit = { path = "third_party/xilem/masonry_winit", default-features = false }
masonry_testing = { path = "third_party/xilem/masonry_testing" }

# Reading aids (Agent S): terminal cell widths for the RSVP box (already in
# the tree through ratatui).
unicode-width = "0.2"

# Signals: Ctrl+C, SIGTERM, SIGHUP, and the Windows console closing
# (the terminal reader saves and restores the terminal on each).
ctrlc = { version = "3.4", features = ["termination"] }

# Wave 3 formats and OCR (Agent W3d; docs/research/pure-rust-wave3.md, ADR-0026).
# OCR in process: the ocrs engine on the RTen runtime (both pure Rust; rten
# and rten-tensor are declared with W3f's entries below), with PDF pages
# rendered by hayro. Models download at run time, after the user confirms,
# and are checked by SHA-256.
rten-imageproc = "0.26.0"
ocrs = { version = "0.13.1", default-features = false, features = ["onnx"] }
# Embedded fonts and CMaps are off: OCR renders pages that have no text.
hayro = { version = "0.7.1", default-features = false }
# hayro's geometry types, for the device that finds a scanned page's single
# image (already in the tree through hayro).
kurbo = "0.13"
# Image files for OCR (both were already in the tree through krilla).
png = "0.18"
zune-jpeg = "0.5"
# Spreadsheets (XLSX, XLS, ODS) and archives (tar, tar.gz, 7z). flate2 was
# in the tree already (zip, png); its default back end is pure Rust.
calamine = "0.36.1"
flate2 = "1.1"
tar = { version = "0.4.46", default-features = false }
sevenz-rust2 = { version = "0.23.0", default-features = false }
# Define word (Agent W3e): headwords in a finite-state map, entries in zstd
# blocks, both pure Rust (docs/research/pure-rust-wave3.md).
fst = "0.4.7"
ruzstd = "0.9"
# Wave 3, Agent W3f: Piper voices and Whisper dictation in-process on RTen,
# the pure-Rust ONNX runtime (ADR-0023, docs/research/pure-rust-wave3.md).
# `rten_format` (RTen's own model files) is off: the models are ONNX.
# `random` is for the noise Piper's voice graphs draw (RandomNormalLike).
rten = { version = "0.26", default-features = false, features = ["onnx_format", "contrib", "random"] }
rten-tensor = "0.26"
rten-generate = { version = "0.26", features = ["text-decoder"] }
rten-text = "0.26"
# Whisper's spectrogram (the FFT crate rten itself uses).
rustfft = "6.4"
# Pure-Rust eSpeak NG (GPL-3.0-or-later, as textweaver): Piper's phonemizer
# when libespeak-ng is not installed. Only English data is embedded.
espeak-ng = { version = "0.2", default-features = false, features = ["bundled-data-en"] }
# Microphone dictation: voice activity detection (model built in) and
# resampling to Whisper's 16 kHz.
earshot = "1.2"
rubato = "5.0"
# Download checks: SHA-256 for Hugging Face LFS files, the git blob SHA-1
# for the small files kept in git.
sha2 = "0.10"
sha1 = "0.10"

# tests
proptest = "1.11"
insta = { version = "1.48", features = ["json", "yaml"] }
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stderr = "allow"

[profile.dev.package."*"]
opt-level = 1

# Neural models are unusably slow unoptimized (OCR detection takes 4.8 s in
# debug and 0.11 s in release), so the runtime and the OCR engine build
# optimized in dev too.
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
[profile.dev.package.rten-generate]
opt-level = 3
[profile.dev.package.rten-text]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.rten-imageproc]
opt-level = 3
[profile.dev.package.rten-parallel]
opt-level = 3
[profile.dev.package.ocrs]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Release packages (`cargo xtask dist`): the release profile with fat LTO,
# slower to build and a little smaller and faster to run.
[profile.dist]
inherits = "release"
lto = "fat"

# Parley 0.8.0 with its `accesskit` feature moved to AccessKit 0.25, for the
# vendored Masonry (ADR-0027). No other crate in the workspace uses Parley.
[patch.crates-io]
parley = { path = "third_party/xilem/parley" }
