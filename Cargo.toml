[workspace]
resolver = "3"
members = [
    "crates/textweaver-core",
    "crates/textweaver-text",
    "crates/textweaver-formats",
    "crates/textweaver-speech",
    "crates/textweaver-store",
    "crates/textweaver-keymap",
    "crates/textweaver-a11y",
    "crates/textweaver-editor",
    "crates/textweaver-app",
    "crates/textweaver-tui",
    "crates/textweaver-cli",
    "crates/textweaver-eci",
    "crates/textweaver-apple",
    "crates/textweaver-sapi",
    "crates/textweaver-enginehost",
    "crates/textweaver-export",
    "crates/textweaver-vault",
    "crates/textweaver-dictation",
    "crates/textweaver-gui",
    "crates/textweaver-render",
    "crates/textweaver-convert",
    "crates/textweaver-writers",
    "crates/textweaver-math",
    "crates/textweaver-cite",
    "crates/textweaver-theme",
    "crates/textweaver-aids",
    "xtask",
]
default-members = [
    "crates/textweaver-core",
    "crates/textweaver-text",
    "crates/textweaver-formats",
    "crates/textweaver-speech",
    "crates/textweaver-store",
    "crates/textweaver-keymap",
    "crates/textweaver-a11y",
    "crates/textweaver-editor",
    "crates/textweaver-app",
    "crates/textweaver-tui",
    "crates/textweaver-cli",
    "crates/textweaver-eci",
    "crates/textweaver-apple",
    "crates/textweaver-sapi",
    "crates/textweaver-enginehost",
    "crates/textweaver-export",
    "crates/textweaver-vault",
    "crates/textweaver-dictation",
    "crates/textweaver-render",
    "crates/textweaver-convert",
    "crates/textweaver-writers",
    "crates/textweaver-math",
    "crates/textweaver-cite",
    "crates/textweaver-theme",
    "crates/textweaver-aids",
]

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
repository = "https://github.com/leavesofgrass/textweaver"
authors = ["Jon Pielaet"]
publish = false

# Every dependency any crate may use is declared here (ADR-0001). Crates opt in
# with `name.workspace = true` in their own Cargo.toml. Adding a crate to this
# table is an orchestrator decision; agents request it in their report.
[workspace.dependencies]
# internal
textweaver-core = { path = "crates/textweaver-core" }
textweaver-text = { path = "crates/textweaver-text" }
textweaver-formats = { path = "crates/textweaver-formats" }
textweaver-speech = { path = "crates/textweaver-speech" }
textweaver-store = { path = "crates/textweaver-store" }
textweaver-keymap = { path = "crates/textweaver-keymap" }
textweaver-a11y = { path = "crates/textweaver-a11y" }
textweaver-editor = { path = "crates/textweaver-editor" }
textweaver-app = { path = "crates/textweaver-app" }
textweaver-tui = { path = "crates/textweaver-tui" }
textweaver-eci = { path = "crates/textweaver-eci" }
textweaver-apple = { path = "crates/textweaver-apple" }
textweaver-sapi = { path = "crates/textweaver-sapi" }
textweaver-enginehost = { path = "crates/textweaver-enginehost" }
textweaver-export = { path = "crates/textweaver-export" }
textweaver-vault = { path = "crates/textweaver-vault" }
textweaver-dictation = { path = "crates/textweaver-dictation" }
textweaver-render = { path = "crates/textweaver-render" }
textweaver-convert = { path = "crates/textweaver-convert" }
textweaver-writers = { path = "crates/textweaver-writers" }
textweaver-math = { path = "crates/textweaver-math" }
textweaver-cite = { path = "crates/textweaver-cite" }
textweaver-theme = { path = "crates/textweaver-theme" }
textweaver-aids = { path = "crates/textweaver-aids" }

# text and formats
ropey = "1.6"
unicode-segmentation = "1.13"
regex = "1.13"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
scraper = "0.27"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
roxmltree = "0.21"

# persistence
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
directories = "6"

# errors, flags, logging
thiserror = "2"
anyhow = "1"
bitflags = { version = "2", features = ["serde"] }
log = "0.4"

# frontends
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"

# speech engines (all behind features in textweaver-speech)
espeakng-sys = "0.3"
speech-dispatcher = "0.16"
tts = "0.26"
rodio = { version = "0.22", default-features = false }

# ETI-Eloquence host: runtime loading of the user-installed ECI library
libloading = "0.9"

# Apple speech (macOS only; used under cfg(target_os = "macos") in textweaver-apple)
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-avf-audio = "0.3"
block2 = "0.6"

# Windows SAPI5 (Windows only; used under cfg(windows) in textweaver-sapi)
windows = "0.62"

# Wave 2
# PDF: candidates for Agent A's loader choice (ADR-0010); only the chosen one stays.
lopdf = "0.45"
pdf-extract = "0.12"
pdfium-render = "0.9"
# Character encodings (legacy HTML, Windows-1252 text).
encoding_rs = "0.8"
# Hot-folder watch for batch conversion.
notify = "8"
# Conversion and rendering (Agents L and M)
comrak = { version = "0.55", default-features = false }
minijinja = "2.24"
rayon = "1.12"
walkdir = "2.5"
pulldown-latex = "0.8"
ammonia = "4.2"
krilla = "0.8"
# Citations (Agent P): bibliography model and CSL styles, BibTeX, blocking HTTP
hayagriva = "0.10"
biblatex = "0.12"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
# Performance (ADR-0001): async I/O outside speech, memory-mapped reading
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
memmap2 = "0.9"
# GUI (wave 3 spike; the textweaver-gui crate only).
wxdragon = "0.9"
live-region = "0.3"

# Reading aids (Agent S): terminal cell widths for the RSVP box (already in
# the tree through ratatui).
unicode-width = "0.2"

# tests
proptest = "1.11"
insta = { version = "1.48", features = ["json", "yaml"] }
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stderr = "allow"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
